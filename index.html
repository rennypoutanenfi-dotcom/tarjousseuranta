  var rk = { call: "p1", pos: { p1: 0, p2: 0 }, editing: false, editStep: null, newKind: "q", resetArmed: false, overlay: null, overlayFor: null };

  // Omat muokkaukset: { calls: { p1: { order:[], hidden:{}, customSteps:[{id,title,items:[]}], itemOrder:{}, customItems:{} } } }
  function rkKey() { return "ts_runko_" + ((state.profile && state.profile.nickname) || "anon").trim().toLowerCase(); }
  function rkLoad() {
    if (rk.overlay && rk.overlayFor === rkKey()) return rk.overlay;
    var data = null;
    try { var ls = safeLS(); var raw = ls ? ls.getItem(rkKey()) : null; if (raw) data = JSON.parse(raw); } catch (e) { data = null; }
    if (!data || typeof data !== "object" || !data.calls) data = { calls: {} };
    rk.overlay = data; rk.overlayFor = rkKey();
    return data;
  }
  function rkSave() {
    try { var ls = safeLS(); if (ls) ls.setItem(rkKey(), JSON.stringify(rk.overlay)); } catch (e) {}
  }
  function rkCallOv(callId) {
    var d = rkLoad();
    if (!d.calls[callId]) d.calls[callId] = {};
    var c = d.calls[callId];
    c.order = c.order || []; c.hidden = c.hidden || {}; c.customSteps = c.customSteps || [];
    c.itemOrder = c.itemOrder || {}; c.customItems = c.customItems || {};
    return c;
  }
  function rkHasEdits() {
    var d = rkLoad();
    return Object.keys(d.calls).some(function (k) {
      var c = d.calls[k];
      return (c.order && c.order.length) || (c.hidden && Object.keys(c.hidden).length) || (c.customSteps && c.customSteps.length) ||
        (c.itemOrder && Object.keys(c.itemOrder).length) || (c.customItems && Object.keys(c.customItems).some(function (s) { return c.customItems[s].length; }));
    });
  }

  // Keep the saved order, and slot any id the saved order does not know
  // (new team steps, new own steps) in right after its default predecessor.
  function rkMergeOrder(defaultIds, saved) {
    var known = {}; defaultIds.forEach(function (id) { known[id] = true; });
    var res = [];
    (saved || []).forEach(function (id) { if (known[id] && res.indexOf(id) === -1) res.push(id); });
    defaultIds.forEach(function (id, i) {
      if (res.indexOf(id) !== -1) return;
      var pos = i > 0 ? res.indexOf(defaultIds[i - 1]) + 1 : 0;
      res.splice(pos, 0, id);
    });
    return res;
  }

  function rkBuild(callId) {
    var tpl = RUNKO_TEMPLATE.filter(function (c) { return c.id === callId; })[0];
    var ov = rkCallOv(callId);
    var byId = {};
    var defaults = [];
    tpl.steps.forEach(function (s) { byId[s.id] = { id: s.id, title: s.title, sub: s.sub, items: s.items, custom: false }; defaults.push(s.id); });
    ov.customSteps.forEach(function (s) { byId[s.id] = { id: s.id, title: s.title, sub: "", items: [], custom: true }; defaults.push(s.id); });
    var order = rkMergeOrder(defaults, ov.order);
    return order.map(function (sid) {
      var s = byId[sid];
      var own = s.custom ? (ov.customSteps.filter(function (c) { return c.id === sid; })[0].items || []) : (ov.customItems[sid] || []);
      var itemsById = {}; var idefaults = [];
      (s.custom ? [] : s.items).forEach(function (it) { itemsById[it.id] = Object.assign({ custom: false }, it); idefaults.push(it.id); });
      own.forEach(function (it) { itemsById[it.id] = Object.assign({ custom: true }, it); idefaults.push(it.id); });
      var iorder = rkMergeOrder(idefaults, ov.itemOrder[sid]);
      return {
        id: sid, title: s.title, sub: s.sub, custom: s.custom, hidden: !!ov.hidden[sid],
        items: iorder.map(function (iid) { return Object.assign({}, itemsById[iid], { hidden: !!ov.hidden[iid] }); })
      };
    });
  }
  function rkVisible(callId) {
    return rkBuild(callId).filter(function (s) { return !s.hidden; }).map(function (s) {
      return Object.assign({}, s, { items: s.items.filter(function (i) { return !i.hidden; }) });
    });
  }
  function rkCallTitle(callId) { return RUNKO_TEMPLATE.filter(function (c) { return c.id === callId; })[0].title; }
  function rkOtherCall(callId) { return callId === "p1" ? "p2" : null; }

    var bar = document.createElement("div");

      nextAction = function () { rk.call = "p1"; rk.pos.p1 = 0; rk.pos.p2 = 0; render(); window.scrollTo(0, 0); };
    }
    bar.innerHTML =
      '<div class="rk-next-inner">' +
        '<button type="button" class="rk-prev" aria-label="Edellinen vaihe"' + (idx === 0 ? " disabled" : "") + '>' + RK_ICON.left + '</button>' +
        '<button type="button" class="rk-fwd' + (isEnd ? " end" : "") + '"><span class="t"><span class="l">' + escapeHtml(nextLabel) + '</span><span class="s">' + escapeHtml(nextTitle) + '</span></span>' + RK_ICON.right + '</button>' +

  function rkPlaceBar() {
    var bar = document.querySelector(".rk-next");

    if (card && window.matchMedia("(min-width: 900px)").matches) {
      var r = card.getBoundingClientRect();
      bar.style.left = r.left + "px"; bar.style.width = r.width + "px";

  }

    return '<div class="rk-q"><span>' + t + own + '</span></div>';
  }

  function rkGo(i) { rk.pos[rk.call] = i; render(); window.scrollTo(0, 0); }

  function rkSwipe(el, count) {
    var sx = null, sy = null;
    el.addEventListener("touchstart", function (e) { var t = e.touches[0]; sx = t.clientX; sy = t.clientY; }, { passive: true });
    el.addEventListener("touchend", function (e) {
      if (sx === null) return;
      var t = e.changedTouches[0]; var dx = t.clientX - sx; var dy = t.clientY - sy; sx = null;
      if (Math.abs(dx) < 70 || Math.abs(dx) < Math.abs(dy) * 1.5) return;
      var i = rk.pos[rk.call];
      if (dx < 0 && i < count - 1) rkGo(i + 1);
      else if (dx > 0 && i > 0) rkGo(i - 1);
    }, { passive: true });
  }

    var copy = list.slice(); copy[i] = list[j]; copy[j] = id; return copy;
  }

    steps.forEach(function (s, i) {
      var row = document.createElement("div");
      row.className = "rk-erow" + (s.hidden ? " off" : "");
      var visibleItems = s.items.filter(function (it) { return !it.hidden; }).length;
      row.innerHTML =
        '<div class="txt"><span class="kind">Vaihe ' + (i + 1) + (s.custom ? " · oma" : "") + (s.hidden ? " · piilotettu" : "") + '</span><b>' + escapeHtml(s.title) + '</b>' +
          '<span class="kind" style="text-transform:none;letter-spacing:0;font-weight:500;">' + visibleItems + ' kohtaa</span></div>' +
        '<button type="button" class="rk-ib" data-a="up" aria-label="Siirrä ylös"' + (i === 0 ? " disabled" : "") + '>' + RK_ICON.up + '</button>' +
        '<button type="button" class="rk-ib" data-a="down" aria-label="Siirrä alas"' + (i === steps.length - 1 ? " disabled" : "") + '>' + RK_ICON.down + '</button>' +
        (s.custom
          ? '<button type="button" class="rk-ib del" data-a="del" aria-label="Poista vaihe">' + RK_ICON.trash + '</button>'
          : '<button type="button" class="rk-ib" data-a="hide" aria-label="' + (s.hidden ? "Näytä" : "Piilota") + '">' + (s.hidden ? RK_ICON.eyeOff : RK_ICON.eye) + '</button>') +
        '<button type="button" class="rk-ib go" data-a="open" aria-label="Muokkaa kohtia">' + RK_ICON.right + '</button>';
      row.querySelector('[data-a="up"]').addEventListener("click", function () { ov.order = rkMove(ids, s.id, -1); rkSave(); render(); });
      row.querySelector('[data-a="down"]').addEventListener("click", function () { ov.order = rkMove(ids, s.id, 1); rkSave(); render(); });
      var hb = row.querySelector('[data-a="hide"]');
      if (hb) hb.addEventListener("click", function () { if (ov.hidden[s.id]) delete ov.hidden[s.id]; else ov.hidden[s.id] = true; rkSave(); render(); });
      var db = row.querySelector('[data-a="del"]');
      if (db) db.addEventListener("click", function () {
        ov.customSteps = ov.customSteps.filter(function (c) { return c.id !== s.id; });
        ov.order = ov.order.filter(function (x) { return x !== s.id; });
        delete ov.itemOrder[s.id];
        rkSave(); render(); showToast("Oma vaihe poistettu");
      });
      row.querySelector('[data-a="open"]').addEventListener("click", function () { rk.editStep = s.id; render(); window.scrollTo(0, 0); });
      list.appendChild(row);
    });
    main.appendChild(list);

    var add = document.createElement("div");
    add.className = "card rk-add";
    add.innerHTML = '<h2>Lisää oma vaihe</h2><input type="text" id="rkNewStep" placeholder="Vaiheen otsikko, esim. Rahoituksen läpikäynti"><button type="button" class="btn btn-ghost" id="rkAddStep">Lisää vaihe loppuun</button>';
    add.querySelector("#rkAddStep").addEventListener("click", function () {
      var v = add.querySelector("#rkNewStep").value.trim();
      if (!v) { showToast("Kirjoita otsikko ensin"); return; }
      var id = "own-" + genId();
      ov.customSteps.push({ id: id, title: v, items: [] });
      ov.order = ids.concat([id]);
      rkSave(); rk.editStep = id; render(); window.scrollTo(0, 0);
      showToast("Vaihe lisätty, lisää sille kohdat");
    });
    main.appendChild(add);

    if (rkHasEdits()) {
      var reset = document.createElement("button");
      reset.type = "button";
      reset.className = "btn btn-ghost";
      reset.style.color = "var(--bad)";
      reset.textContent = rk.resetArmed ? "Vahvista: poista kaikki omat muutokset" : "Palauta tiimin pohja";
      reset.addEventListener("click", function () {
        if (!rk.resetArmed) { rk.resetArmed = true; render(); return; }
        rk.overlay = { calls: {} }; rkSave(); rk.resetArmed = false; rk.pos = { p1: 0, p2: 0 };
        render(); showToast("Tiimin pohja palautettu");
      });
      main.appendChild(reset);
    }
  }

  function renderRunkoEditStep(main) {
    var ov = rkCallOv(rk.call);
    var steps = rkBuild(rk.call);
    var s = steps.filter(function (x) { return x.id === rk.editStep; })[0];
    if (!s) { rk.editStep = null; render(); return; }
    var ids = s.items.map(function (i) { return i.id; });
    var ownArr = s.custom
      ? ov.customSteps.filter(function (c) { return c.id === s.id; })[0].items
      : (ov.customItems[s.id] = ov.customItems[s.id] || []);

    var head = document.createElement("div");
    head.className = "rk-edit-head";
    head.innerHTML = '<button type="button" class="btn btn-ghost btn-sm" id="rkBack">‹ Vaiheet</button><button type="button" class="btn btn-primary btn-sm" id="rkDone">Valmis</button>';
    head.querySelector("#rkBack").addEventListener("click", function () { rk.editStep = null; render(); window.scrollTo(0, 0); });
    head.querySelector("#rkDone").addEventListener("click", function () { rk.editing = false; rk.editStep = null; render(); window.scrollTo(0, 0); });
    main.appendChild(head);

    var title = document.createElement("div");
    title.innerHTML = '<div class="rk-eyebrow">' + escapeHtml(rkCallTitle(rk.call)) + (s.custom ? " · oma vaihe" : "") + '</div><div class="rk-title" style="font-size:22px;">' + escapeHtml(s.title) + '</div>';
    main.appendChild(title);

    var list = document.createElement("div");
    list.className = "rk-elist";
    if (!s.items.length) list.innerHTML = '<div class="empty-note">Ei vielä kohtia.</div>';
    s.items.forEach(function (it, i) {
      var row = document.createElement("div");
      row.className = "rk-erow" + (it.hidden ? " off" : "");
      var shown = it.k === "kv" ? (it.t + (it.v ? ": " + it.v : "")) : it.t;
      row.innerHTML =
        '<div class="txt"><span class="kind">' + RK_KIND_LABEL[it.k || "q"] + (it.custom ? " · oma" : "") + (it.hidden ? " · piilotettu" : "") + '</span>' + escapeHtml(shown) + '</div>' +
        '<button type="button" class="rk-ib" data-a="up" aria-label="Siirrä ylös"' + (i === 0 ? " disabled" : "") + '>' + RK_ICON.up + '</button>' +
        '<button type="button" class="rk-ib" data-a="down" aria-label="Siirrä alas"' + (i === s.items.length - 1 ? " disabled" : "") + '>' + RK_ICON.down + '</button>' +
        (it.custom
          ? '<button type="button" class="rk-ib del" data-a="del" aria-label="Poista kohta">' + RK_ICON.trash + '</button>'
          : '<button type="button" class="rk-ib" data-a="hide" aria-label="' + (it.hidden ? "Näytä" : "Piilota") + '">' + (it.hidden ? RK_ICON.eyeOff : RK_ICON.eye) + '</button>');
      row.querySelector('[data-a="up"]').addEventListener("click", function () { ov.itemOrder[s.id] = rkMove(ids, it.id, -1); rkSave(); render(); });
      row.querySelector('[data-a="down"]').addEventListener("click", function () { ov.itemOrder[s.id] = rkMove(ids, it.id, 1); rkSave(); render(); });
      var hb = row.querySelector('[data-a="hide"]');
      if (hb) hb.addEventListener("click", function () { if (ov.hidden[it.id]) delete ov.hidden[it.id]; else ov.hidden[it.id] = true; rkSave(); render(); });
      var db = row.querySelector('[data-a="del"]');
      if (db) db.addEventListener("click", function () {
        var k = ownArr.findIndex(function (o) { return o.id === it.id; });
        if (k !== -1) ownArr.splice(k, 1);
        if (ov.itemOrder[s.id]) ov.itemOrder[s.id] = ov.itemOrder[s.id].filter(function (x) { return x !== it.id; });
        rkSave(); render(); showToast("Kohta poistettu");
      });
      list.appendChild(row);
    });
    main.appendChild(list);

    var add = document.createElement("div");
    add.className = "card rk-add";
    add.innerHTML =
      '<h2>Lisää oma kohta</h2>' +
      '<div class="rk-kinds">' + ["q", "tip", "say", "h"].map(function (k) {
        return '<button type="button" data-k="' + k + '" class="' + (rk.newKind === k ? "on" : "") + '">' + RK_KIND_LABEL[k] + '</button>';
      }).join("") + '</div>' +
      '<textarea id="rkNewItem" rows="3" placeholder="' + (rk.newKind === "say" ? "Mitä sanot asiakkaalle, esim. Miltä tämä kuulostaa?" : "Kirjoita kohta") + '"></textarea>' +
      '<button type="button" class="btn btn-ghost" id="rkAddItem">Lisää kohta loppuun</button>' +
      '<div class="rk-note">Siirrä kohta oikeaan kohtaan nuolilla lisäämisen jälkeen.</div>';
    Array.prototype.forEach.call(add.querySelectorAll(".rk-kinds button"), function (b) {
      b.addEventListener("click", function () {
        var draft = add.querySelector("#rkNewItem").value;
        rk.newKind = b.getAttribute("data-k"); render();
        var ta = document.getElementById("rkNewItem"); if (ta) ta.value = draft;
      });
    });
    add.querySelector("#rkAddItem").addEventListener("click", function () {
      var v = add.querySelector("#rkNewItem").value.trim();
      if (!v) { showToast("Kirjoita kohta ensin"); return; }
      var id = "own-" + genId();
      ownArr.push({ id: id, k: rk.newKind, t: v });
      ov.itemOrder[s.id] = ids.concat([id]);
      rkSave(); render(); showToast("Kohta lisätty");
    });
    main.appendChild(add);
  }

  document.addEventListener("keydown", function (e) {
    if (state.authStatus !== "ready" || state.tab !== "runko" || rk.editing) return;
    var t = e.target && e.target.tagName;
    if (t === "INPUT" || t === "TEXTAREA" || t === "SELECT" || e.altKey || e.ctrlKey || e.metaKey) return;
    var btn = e.key === "ArrowRight" ? document.querySelector(".rk-fwd") : e.key === "ArrowLeft" ? document.querySelector(".rk-prev") : null;
    if (btn && !btn.disabled) { e.preventDefault(); btn.click(); }
  });

  // ---------- Kuuma liidi -pisteytys ----------
  // Jokainen kysymys: vaihtoehdot järjestyksessä 10 / 5 / 0 pistettä.
  // fix = lyhyt nimi "mikä puuttuu" -lauseeseen.
  var LEAD_QUESTIONS = [
    { id: "aika", q: "Milloin auton hankinta on ajankohtainen?", o: ["Tänään–7 pv", "Tämän kuun aikana", "Myöhemmin"], fix: "hankinnan sopiminen tälle viikolle" },
    { id: "auto", q: "Onko asiakas jo löytänyt kiinnostavan auton?", o: ["Juuri tämä auto", "Muutama vaihtoehto", "Vain kartoittaa"], fix: "yhteen autoon keskittyminen" },
    { id: "kkera", q: "Onko rahoituksen kuukausierä sopivalla tasolla?", o: ["Kyllä", "Lähes", "Ei vielä tiedossa"], fix: "sopivan kuukausierän löytäminen" },
    { id: "vaihto", q: "Onko vaihtoauto arvioitu?", o: ["Kyllä", "Tiedot osittain", "Ei vaihtoautoa tai ei arvioitu"], fix: "vaihtoauton arviointi" },
    { id: "paattaja", q: "Onko päätöksentekijä paikalla tai mukana keskustelussa?", o: ["Kyllä", "Tavoitettavissa", "Ei"], fix: "päätöksentekijän osallistuminen" },
    { id: "koeajo", q: "Onko koeajo tehty tai sovittu?", o: ["Tehty", "Sovittu", "Ei"], fix: "koeajo" },
    { id: "budjetti", q: "Onko budjetti selvillä?", o: ["Selkeä", "Suuntaa-antava", "Ei tiedossa"], fix: "budjetin selvittäminen" },
    { id: "syy", q: "Onko asiakkaalla selkeä syy vaihtaa autoa?", o: ["Kyllä, akuutti", "Jonkinlainen", "Ei todellista painetta"], fix: "vaihtamisen syyn kirkastaminen" },
    { id: "kilpailu", q: "Onko hän kilpailuttamassa aktiivisesti?", o: ["Ei, keskittyy tähän autoon", "Vertailee vähän", "Hakee vain halvinta"], fix: "kilpailutuksen lopettaminen tähän autoon" },
    { id: "askel", q: "Onko seuraava askel sovittu tarkasti?", o: ["Kyllä: aika + sisältö", "Palataan asiaan", "Ei"], fix: "tarkka seuraava askel (aika + sisältö)" }
  ];
  var LEAD_POINTS = [10, 5, 0];
  var LEAD_TIERS = [
    { min: 80, key: "hot", icon: "🔥", name: "Kuuma", action: "Klousaa nyt: varaus, rahoitushakemus tai kaupan hyväksyntä." },
    { min: 60, key: "warm", icon: "🟠", name: "Lämmin", action: "Varaa konkreettinen seuraava askel 24–48 h sisään." },
    { min: 40, key: "tepid", icon: "🟡", name: "Haalea", action: "Selvitä yksi suurin este: budjetti, vaihtoauto tai päätöksentekijä." },
    { min: 0, key: "cold", icon: "🔵", name: "Kylmä", action: "Kevyt seuranta, älä käytä liikaa aikaa heti." }
  ];
  var lead = { answers: {} }; // id -> vaihtoehdon indeksi 0/1/2

  function leadTier(score) {
    for (var i = 0; i < LEAD_TIERS.length; i++) if (score >= LEAD_TIERS[i].min) return LEAD_TIERS[i];
    return LEAD_TIERS[LEAD_TIERS.length - 1];
  }
  function leadScore() {
    var s = 0;
    LEAD_QUESTIONS.forEach(function (q) { var a = lead.answers[q.id]; if (a !== undefined) s += LEAD_POINTS[a]; });
    return s;
  }
  function leadAnsweredCount() {
    return LEAD_QUESTIONS.filter(function (q) { return lead.answers[q.id] !== undefined; }).length;
  }
  function joinFi(list) {
    if (list.length <= 1) return list.join("");
    return list.slice(0, -1).join(", ") + " ja " + list[list.length - 1];
  }
  // Pienin määrä parannuksia, joilla päästään kuumaksi (80+). Vastatut kysymykset
  // ensin (ne ovat tiedossa olevia puutteita), isoin pistelisäys ensin.
  function leadGap(score) {
    if (score >= 80) return null;
    var cands = LEAD_QUESTIONS.map(function (q, i) {
      var a = lead.answers[q.id];
      var cur = a === undefined ? 0 : LEAD_POINTS[a];
      return { q: q, i: i, gain: 10 - cur, answered: a !== undefined };
    }).filter(function (c) { return c.gain > 0; });
    cands.sort(function (x, y) {
      if (x.answered !== y.answered) return x.answered ? -1 : 1;
      return y.gain - x.gain || x.i - y.i;
    });
    var picked = [], s = score;
    for (var k = 0; k < cands.length && s < 80; k++) { picked.push(cands[k]); s += cands[k].gain; }
    return { picked: picked, to: s };
  }
  function capFirst(t) { return t.charAt(0).toUpperCase() + t.slice(1); }

  function leadResultHtml() {
    var score = leadScore(), n = leadAnsweredCount(), t = leadTier(score);
    var r = 46, c = 2 * Math.PI * r, dash = c * score / 100;
    var html =
      '<div class="ld-res-top">' +
        '<div class="ld-ring"><svg viewBox="0 0 110 110"><circle class="bg" cx="55" cy="55" r="' + r + '"></circle>' +
          '<circle class="fg" cx="55" cy="55" r="' + r + '" style="stroke-dasharray:' + c + ';stroke-dashoffset:' + (c - dash) + '"></circle></svg>' +
          '<div class="ld-num"><b>' + score + '</b><span>/ 100</span></div></div>' +
        '<div class="ld-res-side">' +
          '<div class="ld-tier">' + t.icon + ' ' + t.name + '</div>' +
          '<div class="ld-action">' + escapeHtml(t.action) + '</div>' +
        '</div>' +
      '</div>';
    if (n < LEAD_QUESTIONS.length) {
      html += '<div class="ld-note">Vastattu ' + n + ' / ' + LEAD_QUESTIONS.length + '. Vastaamattomat lasketaan nollaksi.</div>';
    }
    var gap = leadGap(score);
    if (gap && n > 0) {
      var names = gap.picked.slice(0, 3).map(function (p) { return p.q.fix; });
      var more = gap.picked.length - names.length;
      var verb = gap.picked.length === 1 ? "nostaisi" : "nostaisivat";
      var txt = capFirst(joinFi(names)) + (more > 0 ? " sekä " + more + " muuta asiaa" : "") + " " + verb + " arvion " + score + " → " + Math.min(gap.to, 100) + " pisteeseen.";
      html += '<div class="ld-gap"><div class="h">Mikä puuttuu, jotta tästä tulee kuuma?</div><div class="t">' + escapeHtml(txt) + '</div>' +
        '<ul>' + gap.picked.map(function (p) {
          return '<li><span>' + escapeHtml(p.q.q) + '</span><b>+' + p.gain + '</b></li>';
        }).join("") + '</ul></div>';
    } else if (score >= 80) {
      html += '<div class="ld-gap hot"><div class="h">Liidi on kuuma</div><div class="t">Älä jää odottamaan. Kysy kauppaa nyt.</div></div>';
    }
    return html;
  }

  function renderLead(main) {
    var t = leadTier(leadScore());
    main.classList.add("ld-main", "ld-" + t.key);

    var bar = document.createElement("div");
    bar.className = "ld-mini";
    bar.setAttribute("role", "button");
    bar.innerHTML = '<span class="s">' + leadScore() + '</span>' +
      '<span class="mid"><span class="tn">' + t.icon + ' ' + t.name + '</span><span class="ac">' + escapeHtml(t.action) + '</span></span>' +
      '<span class="c">' + leadAnsweredCount() + '/' + LEAD_QUESTIONS.length + '<br>Tulos ↓</span>';
    bar.addEventListener("click", function () {
      var r = document.querySelector(".ld-res"); if (r) r.scrollIntoView({ behavior: "smooth", block: "start" });
    });
    main.appendChild(bar);

    var qs = document.createElement("div");
    qs.className = "ld-qs";
    qs.innerHTML = '<div class="ld-head"><h2>Kuuma liidi</h2><button type="button" class="btn btn-ghost btn-sm" id="ldReset"' + (leadAnsweredCount() ? '' : ' disabled') + '>Tyhjennä</button></div>' +
      LEAD_QUESTIONS.map(function (q, i) {
        var a = lead.answers[q.id];
        return '<div class="card ld-q' + (a !== undefined ? ' done' : '') + '"><div class="qt"><span class="qn">' + (i + 1) + '</span>' + escapeHtml(q.q) + '</div>' +
          '<div class="ld-opts">' + q.o.map(function (o, k) {
            return '<button type="button" data-q="' + q.id + '" data-k="' + k + '" class="ld-opt p' + LEAD_POINTS[k] + (a === k ? ' on' : '') + '">' +
              '<span>' + escapeHtml(o) + '</span><em>' + LEAD_POINTS[k] + '</em></button>';
          }).join("") + '</div></div>';
      }).join("");
    Array.prototype.forEach.call(qs.querySelectorAll(".ld-opt"), function (b) {
      b.addEventListener("click", function () {
        var id = b.getAttribute("data-q"), k = parseInt(b.getAttribute("data-k"), 10);
        if (lead.answers[id] === k) delete lead.answers[id]; else lead.answers[id] = k;
        var y = window.scrollY; render(); window.scrollTo(0, y);
      });
    });
    qs.querySelector("#ldReset").addEventListener("click", function () {
      lead.answers = {}; render(); window.scrollTo(0, 0); showToast("Pisteytys tyhjennetty");
    });
    main.appendChild(qs);

    var res = document.createElement("div");
    res.className = "card ld-res";
    res.innerHTML = leadResultHtml();
    main.appendChild(res);
  }

  // ---------- Nav + init ----------
  Array.prototype.forEach.call(document.querySelectorAll("nav.tabbar button"), function (b) {
    b.addEventListener("click", function () {
      state.tab = b.getAttribute("data-tab");
      render();
    });
  });
  document.getElementById("settingsBtn").addEventListener("click", openSettings);

  setInterval(function () {
    var k = monthKeyOf(new Date());
    if (k !== state.monthKey) {
      state.monthKey = k;
      localOffers = (curMonthDoc() && curMonthDoc().offers) ? curMonthDoc().offers.slice() : null;
      deletedIds = {};
      render();
    }
  }, 60000);

  render();
  initAuth();
})();
</script>
</body>
