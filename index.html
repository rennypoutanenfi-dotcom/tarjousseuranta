    var r = { basics: [], strengths: [], equip: [], sales: [], negatives: [], repairs: [], tyres: [], history: [], red: [], yellow: [], unknown: [] };
    function red(t) { r.red.push(t); }
    function yel(t) { r.yellow.push(t); }
    function unk(t) { r.unknown.push(t); }

    // Perustiedot
    var km = vtNum(a.km);
    if (a.auto) r.basics.push("Auto: " + a.auto);
    if (km !== null) {
      r.basics.push("Mittarilukema: " + fmtNum(km) + " km");
      if (km < 100000) r.strengths.push("Matala mittarilukema (" + fmtNum(km) + " km)");
      else if (km >= 300000) { r.negatives.push("Erittäin korkea mittarilukema (" + fmtNum(km) + " km)"); red("Mittarilukema yli 300 000 km"); }
      else if (km >= 220000) { r.negatives.push("Korkea mittarilukema (" + fmtNum(km) + " km)"); yel("Korkea mittarilukema"); }
    }
    var jaljella = vtNum(a.rahoitusJaljella), arvio = vtNum(a.asiakasArvio);
    if (a.rahoitus === "Kyllä") r.basics.push("Rahoituksella" + (jaljella !== null ? ", jäljellä " + fmtNum(jaljella) + " €" : ", jäljellä oleva summa selvittämättä"));
    if (a.rahoitus === "Ei") r.basics.push("Ei rahoitusta");
    if (arvio !== null) r.basics.push("Asiakkaan arvio: " + fmtNum(arvio) + " €");
    if (a.rahoitus === "Kyllä" && jaljella === null) unk("Rahoituksen loppusumma");
    if (a.rahoitus === "Kyllä" && jaljella !== null && arvio !== null && jaljella > arvio) {
      r.history.push("Rahoitusta jäljellä enemmän kuin asiakkaan oma arvio autosta (" + fmtNum(jaljella - arvio) + " € erotus)");
      yel("Velkaa enemmän kuin auton arvo asiakkaan arviolla");
    }

    // Historia
    var kirjaTiedossa = a.huoltokirja && a.huoltokirja !== "Ei tiedossa";
    if (kirjaTiedossa && a.puutteet === "Ei") r.sales.push("Täydellinen huoltohistoria (" + a.huoltokirja.toLowerCase() + " huoltokirja)");
    else if (kirjaTiedossa) r.strengths.push("Huoltokirja tallessa (" + a.huoltokirja.toLowerCase() + ")");
    if (a.huoltokirja === "Ei tiedossa") { r.history.push("Huoltokirjaa ei tiedossa"); unk("Huoltokirja"); }
    if (a.puutteet === "Kyllä") {
      r.history.push("Huoltohistoriassa puutteita tai pitkiä huoltovälejä");
      r.negatives.push("Puutteellinen huoltohistoria");
      if (a.huoltokirja === "Ei tiedossa") red("Huoltohistoria puutteellinen eikä huoltokirjaa ole tiedossa"); else yel("Huoltohistoriassa puutteita");
    }
    if (a.puutteet === "Ei tiedossa") unk("Huoltohistorian kattavuus");
    if (a.katsastus === "Voimassa") r.strengths.push("Katsastus voimassa");
    if (a.katsastus === "Tulossa pian") { r.repairs.push("Katsastus tulossa pian"); yel("Katsastus edessä"); }
    if (a.katsastus === "Hylätty aiemmin") { r.history.push("Katsastus hylätty aiemmin, tarkista syy"); yel("Aiempi hylätty katsastus"); }
    if (a.katsastus === "Ei tiedossa") unk("Katsastustilanne (tarkista GT-X:stä)");
    if (a.vauriot === "Ei tiedossa") r.strengths.push("Ei tiedossa olevia vaurioita");
    if (a.vauriot === "Pieniä vaurioita") { r.history.push("Pieniä vaurioita historiassa"); yel("Pieniä vaurioita historiassa"); }
    if (a.vauriot === "Merkittäviä vaurioita") { r.history.push("Merkittäviä vaurioita historiassa"); r.negatives.push("Merkittävä vauriohistoria"); red("Merkittävä vauriohistoria"); }
    if (a.vauriot === "Lunastettu") { r.history.push("Lunastettu auto"); r.negatives.push("Lunastushistoria laskee jälleenmyyntiarvoa selvästi"); red("Lunastettu auto"); }
    if (a.remontit) r.history.push("Isommat remontit: " + a.remontit);
    if (a.avaimet === "1") { r.negatives.push("Vain yksi avain"); yel("Vain yksi avain"); }
    if (a.avaimet === "2" || a.avaimet === "3+") r.sales.push(a.avaimet === "2" ? "Kaksi avainta" : "Kolme tai useampi avain");
    if (a.historiaLisa) r.history.push(a.historiaLisa);

    // Huollot ja tekniikka
    var hKm = vtNum(a.huoltoKm), since = [];
    if (hKm !== null && km !== null && km >= hKm) {
      var d = km - hKm; since.push(fmtNum(d) + " km");
      if (d > 30000) { r.repairs.push("Edellisestä huollosta " + fmtNum(d) + " km"); yel("Huollosta ajettu yli 30 000 km"); }
    }
    if (a.huoltoKk && /^\d{4}-\d{2}$/.test(a.huoltoKk)) {
      var p = a.huoltoKk.split("-"); var mo = (now.getFullYear() - +p[0]) * 12 + (now.getMonth() + 1 - +p[1]);
      if (mo >= 0) since.push(mo + " kk");
      if (mo > 24) { r.repairs.push("Edellisestä huollosta yli 2 vuotta"); yel("Huollosta yli 2 vuotta"); }
    }
    if (since.length) r.basics.push("Edellisestä huollosta: " + since.join(" / "));
    if (a.seuraavaHuolto === "Kyllä") { r.repairs.push("Määräaikaishuolto edessä pian"); yel("Huolto edessä pian"); }
    if (a.seuraavaHuolto === "Ei") r.strengths.push("Ei huoltoa heti edessä");
    if (a.seuraavaHuolto === "Ei tiedossa") unk("Seuraavan huollon ajankohta");
    if (a.hihna === "Vaihdettu") r.sales.push("Jakohihna vaihdettu");
    if (a.hihna === "Vaihdettava pian") { r.repairs.push("Jakohihnan vaihto edessä"); r.negatives.push("Jakohihnan vaihto tulossa"); yel("Jakohihnan vaihto edessä"); }
    if (a.hihna === "Ei tiedossa") unk("Jakohihnan vaihtotilanne");
    if (a.ketju === "Ääntää / vaatii tarkistusta") { r.repairs.push("Jakoketju ääntää, tarkistettava"); red("Jakoketju ääntää tai vaatii tarkistusta"); }
    if (a.ketju === "Ei tiedossa") unk("Jakoketjun kunto");
    if (a.moottori === "Tasainen") r.strengths.push("Moottori käy tasaisesti");
    if (a.moottori === "Huomioitavaa") { r.repairs.push("Moottorin käynnissä huomioitavaa, tarkistettava"); yel("Moottorin käynnissä huomioitavaa"); }
    if (a.vikavalot === "Ei pala") r.strengths.push("Ei vikavaloja");
    if (a.vikavalot === "Palaa") { r.repairs.push("Vikavalo palaa, vian syy selvitettävä"); red("Vikavalo palaa"); }
    if (a.vikavalot === "Ei tarkistettu") unk("Vikavalot");
    if (a.tekniikkaLisa) r.repairs.push(a.tekniikkaLisa);

    // Renkaat
    function tyreSet(name, cond, rim, etu, taka, minMm) {
      if (!cond && !rim && etu === null && taka === null) return;
      var parts = [];
      if (cond) parts.push(cond.toLowerCase());
      if (etu !== null || taka !== null) parts.push("ura " + (etu !== null ? etu : "–") + " / " + (taka !== null ? taka : "–") + " mm");
      if (rim) parts.push("vanteet: " + rim.toLowerCase());
      r.tyres.push(name + ": " + parts.join(", "));
      var low = [etu, taka].some(function (x) { return x !== null && x < minMm; });
      if (cond === "Uusittava pian" || low) { r.repairs.push(name + " uusittava pian"); r.negatives.push(name + " uusittava"); yel(name + " uusittava pian"); }
      if (rim === "Vaurioita") { r.repairs.push(name.replace("renkaat", "vanteet") + " vaurioituneet"); yel(name.replace("renkaat", "vanteissa") + " vaurioita"); }
      if (rim === "Naarmuja") r.repairs.push(name.replace("renkaat", "vanteissa") + " naarmuja (pieni kunnostus)");
      return cond && cond !== "Uusittava pian" && !low;
    }
    var kesaOk = tyreSet("Kesärenkaat", a.kesaRenkaat, a.kesaVanteet, vtNum(a.kesaUraEtu), vtNum(a.kesaUraTaka), 3);
    var talviOk = false;
    if (hasWinter(a)) talviOk = tyreSet("Talvirenkaat (" + a.talvityyppi.toLowerCase() + ")", a.talviRenkaat, a.talviVanteet, vtNum(a.talviUraEtu), vtNum(a.talviUraTaka), 5);
    if (a.talvityyppi === "Ei talvirenkaita") { r.tyres.push("Ei talvirenkaita"); r.negatives.push("Ei talvirenkaita"); }
    if (kesaOk && talviOk) r.sales.push("Kahdet hyväkuntoiset renkaat");
    else if (a.kesaRenkaat && hasWinter(a)) r.sales.push("Kahdet renkaat");

    // Kori ja sisusta
    if (a.maali === "Erinomainen") r.strengths.push("Erinomainen maalipinta");
    if (a.maali === "Huomioitavaa") { r.repairs.push("Maalipinnassa huomioitavaa"); yel("Maalipinnassa huomioitavaa"); }
    if (a.maali === "Vaatii kunnostusta") { r.repairs.push("Maalipinta vaatii kunnostusta"); r.negatives.push("Maalipinta vaatii kunnostusta"); yel("Maalipinta vaatii kunnostusta"); }
    if (a.tuulilasi === "Pieniä") r.repairs.push("Pieniä kiveniskemiä tuulilasissa");
    if (a.tuulilasi === "Merkittäviä") { r.repairs.push("Merkittäviä kiveniskemiä tuulilasissa"); yel("Tuulilasissa merkittäviä kiveniskemiä"); }
    if (a.tuulilasi === "Halkeama") { r.repairs.push("Tuulilasi haljennut, vaihto edessä"); r.negatives.push("Tuulilasin vaihto"); yel("Tuulilasi haljennut"); }
    if (a.naarmut === "Pieniä") r.repairs.push("Pieniä naarmuja tai lommoja");
    if (a.naarmut === "Merkittäviä") { r.repairs.push("Merkittäviä naarmuja tai lommoja"); r.negatives.push("Korikorjauksia tarvitaan"); yel("Merkittäviä naarmuja tai lommoja"); }
    if (a.umpiot === "Kuluneet") r.repairs.push("Umpiot kuluneet");
    if (a.umpiot === "Vaurioituneet") { r.repairs.push("Umpiot vaurioituneet"); yel("Umpiot vaurioituneet"); }
    if (a.sisusta === "Siisti") r.strengths.push("Siisti sisusta");
    if (a.sisusta === "Poikkeavaa kulumaa tai vaurioita") { r.repairs.push("Sisustassa poikkeavaa kulumaa tai vaurioita"); r.negatives.push("Sisustan kunto"); yel("Sisustassa poikkeavaa kulumaa"); }
    if (a.haju === "Lievää hajua") r.repairs.push("Lievää hajua, otsonointi tai pesu");
    if (a.haju === "Tupakoitu / voimakas haju") { r.repairs.push("Tupakan tai voimakkaan hajun poisto"); r.negatives.push("Tupakoitu tai voimakas haju laskee kysyntää"); yel("Tupakoitu tai voimakas haju"); }
    if (a.koriLisa) r.repairs.push(a.koriLisa);

    // Varusteet
    var eq = a.varusteet || {};
    VT_EQUIP.forEach(function (e) { if (eq[e[0]] && e[0] !== "muuvaruste") r.equip.push(e[1]); });
    if (eq.muuvaruste) r.equip.push(a.muuVarusteTxt ? a.muuVarusteTxt : "Muu merkittävä varuste");

    // Täyttöaste
    var done = 0, total = 0;
    VT_SECTIONS.forEach(function (s) { var p = vtProgress(s); done += p.done; total += p.total; });
    r.done = done; r.total = total;

    // Riskiluokka
    r.risk = r.red.length ? "red" : (r.yellow.length ? "yellow" : "green");
    if (r.risk === "green" && r.unknown.length >= 3) { r.risk = "yellow"; r.yellow.push(r.unknown.length + " keskeistä tietoa selvittämättä"); }

    // Sisäänostosuositus
    var plus = r.strengths.length + r.sales.length + Math.min(r.equip.length, 4) / 2;
    var why = [];
    // Lisäselvitys kun puuttuvat tiedot ratkaisevat; tunnetut isot riskit -> varovainen.
    if (r.red.length === 1 && r.unknown.length >= 2) { r.rec = "Vaatii lisäselvityksiä"; why.push("Yksi merkittävä riski ja lisäksi " + r.unknown.length + " keskeistä tietoa selvittämättä: " + r.unknown.map(lcFirst).join(", ") + "."); }
    else if (r.red.length) { r.rec = "Varovainen sisäänosto"; why.push("Merkittäviä riskejä: " + r.red.map(lcFirst).join(", ") + ". Hinnoittele korjauskulut ja riski mukaan."); }
    else if (r.unknown.length >= 3) { r.rec = "Vaatii lisäselvityksiä"; why.push("Selvittämättä: " + r.unknown.map(lcFirst).join(", ") + "."); }
    else if (r.yellow.length >= 4) { r.rec = "Varovainen sisäänosto"; why.push(r.yellow.length + " huomioitavaa asiaa, joiden kustannukset kasautuvat."); }
    else if (r.yellow.length === 0 && plus >= 4) { r.rec = "Vahva sisäänosto"; why.push("Ei riskejä ja " + (r.strengths.length + r.sales.length) + " myyntiä tukevaa vahvuutta."); }
    else { r.rec = "Normaali sisäänosto"; why.push(r.yellow.length ? "Pieniä huomioitavia asioita (" + r.yellow.length + "), jotka voi huomioida hinnassa." : "Ei riskejä, mutta erityisiä vahvuuksia on vähän."); }
    if (r.unknown.length && r.rec !== "Vaatii lisäselvityksiä") why.push("Selvitä vielä: " + r.unknown.map(lcFirst).join(", ") + ".");
    if (done < total * 0.6) why.push("Lista on täytetty " + done + " / " + total + ". Suositus tarkentuu, kun täytät loput.");
    r.recWhy = why;
    return r;
  }

  function lcFirst(t) { return t.charAt(0).toLowerCase() + t.slice(1); }
  var VT_RISK = {
    green: { name: "Vihreä", desc: "Ei merkittäviä riskejä" },
    yellow: { name: "Keltainen", desc: "Huomioitavia asioita tai pieniä kunnostustarpeita" },
    red: { name: "Punainen", desc: "Merkittäviä riskejä, puutteellinen historia tai selviä korjaustarpeita" }
  };

  function vtSummaryHtml() {
    var r = vtEvaluate();
    if (r.done === 0) return '<div class="vt-empty">Yhteenveto ja sisäänostosuositus syntyvät tähän automaattisesti, kun täytät listaa.</div>';
    var rk = VT_RISK[r.risk];
    var reasons = r.risk === "green" ? ["Ei havaittuja riskejä tai kunnostustarpeita."] : (r.risk === "red" ? r.red : r.yellow);
    var extraYellow = r.risk === "red" && r.yellow.length ? " Lisäksi " + r.yellow.length + " pienempää huomioitavaa asiaa (ks. kunnostustarpeet)." : "";
    function block(title, list, cls) {
      if (!list.length) return "";
      return '<div class="vt-b ' + (cls || "") + '"><div class="h">' + title + '</div><ul>' + list.map(function (x) { return "<li>" + escapeHtml(x) + "</li>"; }).join("") + "</ul></div>";
    }
    return '<div class="vt-verdict">' +
        '<div class="vt-risk ' + r.risk + '"><span class="dot"></span><div><b>Riski: ' + rk.name + '</b><span>' + rk.desc + '</span></div></div>' +
        '<div class="vt-rec"><span class="l">Sisäänostosuositus</span><b>' + r.rec + '</b></div>' +
      '</div>' +
      '<div class="vt-b why"><div class="h">Perustelu</div><ul>' +
        '<li><b>Riskiluokka ' + rk.name.toLowerCase() + ':</b> ' + escapeHtml(reasons.join(", ")) + (r.risk === "green" ? "" : ".") + escapeHtml(extraYellow) + '</li>' +
        r.recWhy.map(function (x, i) { return "<li>" + (i === 0 ? "<b>" + escapeHtml(r.rec) + ":</b> " : "") + escapeHtml(x) + "</li>"; }).join("") +
      '</ul></div>' +
      block("Perustiedot", r.basics) +
      block("Vahvuudet hinnoitteluun", r.strengths, "good") +
      block("Arvoa nostavat varusteet", r.equip, "good") +
      block("Myyntiä helpottavat asiat", r.sales, "good") +
      block("Arvoa laskevat asiat", r.negatives, "bad") +
      block("Kunnostus- ja korjaustarpeet", r.repairs, "bad") +
      block("Renkaiden tila", r.tyres) +
      block("Historiassa huomioitavaa", r.history) +
      (vt.a.myyjanArvio ? block("Myyjän arvio", [vt.a.myyjanArvio]) : "") +
      '<button type="button" class="btn btn-ghost" id="vtCopy">Kopioi yhteenveto tekstinä</button>';
  }

  function vtSummaryText() {
    var r = vtEvaluate(), out = [];
    out.push("VAIHTOAUTON TARKASTUS" + (vt.a.auto ? " – " + vt.a.auto : ""));
    out.push("Riski: " + VT_RISK[r.risk].name + " | Suositus: " + r.rec);
    out.push("Perustelu: " + r.recWhy.join(" "));
    [["Perustiedot", r.basics], ["Vahvuudet", r.strengths], ["Arvoa nostavat varusteet", r.equip], ["Myyntiä helpottavat", r.sales],
     ["Arvoa laskevat", r.negatives], ["Kunnostus- ja korjaustarpeet", r.repairs], ["Renkaat", r.tyres], ["Historia", r.history],
     ["Myyjän arvio", vt.a.myyjanArvio ? [vt.a.myyjanArvio] : []]].forEach(function (b) {
      if (b[1].length) { out.push(""); out.push(b[0].toUpperCase()); b[1].forEach(function (x) { out.push("- " + x); }); }
    });
    return out.join("\n");
  }

  function vtFieldHtml(f) {
    var a = vt.a;
    if (!vtVisible(f)) return "";
    var label = f.label ? '<div class="vt-l">' + escapeHtml(f.label) + (f.opt ? '' : '') + '</div>' : '';
    if (f.type === "choice") {
      return '<div class="vt-f">' + label + '<div class="vt-opts' + (f.opts.length === 2 ? ' two' : '') + '">' + f.opts.map(function (o) {
        return '<button type="button" class="vt-opt' + (a[f.id] === o ? ' on' : '') + '" data-f="' + f.id + '" data-v="' + escapeHtml(o) + '">' + escapeHtml(o) + '</button>';
      }).join("") + '</div></div>';
    }
    if (f.type === "num") {
      return '<div class="vt-f">' + label + '<div class="vt-in"><input type="text" inputmode="numeric" data-f="' + f.id + '" value="' + escapeHtml(a[f.id] || "") + '" placeholder="0"><span>' + f.unit + '</span></div></div>';
    }
    if (f.type === "pair") {
      return '<div class="vt-f">' + label + '<div class="vt-pair">' + f.ids.map(function (id, i) {
        return '<div class="vt-in"><em>' + f.names[i] + '</em><input type="text" inputmode="decimal" data-f="' + id + '" value="' + escapeHtml(a[id] || "") + '" placeholder="0"><span>' + f.unit + '</span></div>';
      }).join("") + '</div></div>';
    }
    if (f.type === "month") {
      return '<div class="vt-f">' + label + '<div class="vt-in"><input type="month" data-f="' + f.id + '" value="' + escapeHtml(a[f.id] || "") + '"></div></div>';
    }
    if (f.type === "text") {
      return '<div class="vt-f">' + label + (f.area
        ? '<textarea rows="3" data-f="' + f.id + '" placeholder="' + escapeHtml(f.ph || "Vapaa teksti") + '">' + escapeHtml(a[f.id] || "") + '</textarea>'
        : '<div class="vt-in"><input type="text" data-f="' + f.id + '" value="' + escapeHtml(a[f.id] || "") + '" placeholder="' + escapeHtml(f.ph || "") + '"></div>') + '</div>';
    }
    if (f.type === "checks") {
      var eq = a.varusteet || {};
      return '<div class="vt-checks">' + f.items.map(function (e) {
        return '<button type="button" class="vt-check' + (eq[e[0]] ? ' on' : '') + '" data-eq="' + e[0] + '"><span class="bx"></span><span>' + escapeHtml(e[1]) + '</span></button>';
      }).join("") + '</div>';
    }
    return "";
  }

  function vtMiniTitle(r) {
    if (!r.done) return "Ei vielä arviota";
    if (r.done < r.total * 0.4) return "Arvio kesken – täytä lisää";
    return r.rec;
  }
  function renderVt(main) {
    vtLoad();
    main.classList.add("vt-main");
    var r = vtEvaluate();

    var mini = document.createElement("div");
    mini.className = "vt-mini " + r.risk;
    mini.innerHTML = '<span class="dot"></span><span class="mid"><b>' + vtMiniTitle(r) + '</b><span>Riski ' + VT_RISK[r.risk].name.toLowerCase() + ' · ' + r.done + '/' + r.total + ' täytetty</span></span><span class="go">Yhteenveto ↓</span>';
    mini.addEventListener("click", function () { var s = document.querySelector(".vt-sum"); if (s) s.scrollIntoView({ behavior: "smooth", block: "start" }); });
    main.appendChild(mini);

    var col = document.createElement("div");
    col.className = "vt-col";
    col.innerHTML = '<div class="vt-head"><h2>Vaihtoauton tarkastuslista</h2><button type="button" class="btn btn-ghost btn-sm" id="vtNew">' + (vt.reset ? 'Vahvista tyhjennys' : 'Uusi tarkastus') + '</button></div>' +
      VT_SECTIONS.map(function (s, i) {
        var p = vtProgress(s), open = !!vt.open[s.id];
        var badge = p.total ? '<span class="vt-prog' + (p.done === p.total ? ' full' : '') + '">' + p.done + '/' + p.total + '</span>' : (s.id === "varusteet" ? '<span class="vt-prog">' + Object.keys(vt.a.varusteet || {}).filter(function (k) { return vt.a.varusteet[k]; }).length + ' valittu</span>' : '');
        return '<div class="card vt-sec' + (open ? ' open' : '') + '" data-s="' + s.id + '">' +
          '<button type="button" class="vt-sh" data-toggle="' + s.id + '"><span class="n">' + (i + 1) + '</span><span class="t">' + s.title + '</span>' + badge + '<span class="chev">' + RK_ICON.down + '</span></button>' +
          (open ? '<div class="vt-body">' + s.fields.map(vtFieldHtml).join("") +
            (i < VT_SECTIONS.length - 1 ? '<button type="button" class="btn btn-ghost vt-next" data-next="' + VT_SECTIONS[i + 1].id + '" data-cur="' + s.id + '">Seuraava: ' + VT_SECTIONS[i + 1].title + ' ›</button>' : '<button type="button" class="btn btn-primary vt-next" data-sum="1">Näytä yhteenveto</button>') +
          '</div>' : '') +
        '</div>';
      }).join("");
    main.appendChild(col);

    var sum = document.createElement("div");
    sum.className = "card vt-sum";
    sum.innerHTML = '<div class="vt-sum-h">Yhteenveto ja hinnoittelun tuki</div><div id="vtSumBody">' + vtSummaryHtml() + '</div>';

    function refreshSummary() {

  // ---------- Rahoituslaskuri: laskenta ----------
  // Tavallinen annuiteettilaina. Avausmaksu lisätään lainapääomaan, käsittelymaksu
  // maksetaan jokaisen erän päälle ja jäännöserä viimeisen erän yhteydessä.
  function rfCalc(c, n) {
    var price = Math.max(+c.price || 0, 0), down = Math.min(Math.max(+c.down || 0, 0), price);
    var credit = price - down;                       // luoton määrä (rahoitettava osuus)
    var P = credit > 0 ? credit + (+c.open || 0) : 0; // lainapääoma
    var r = (+c.rate || 0) / 1200, fee = P > 0 ? (+c.fee || 0) : 0;
    var B = Math.min(Math.max(+c.balloon || 0, 0), P);
    var pay = 0;
    if (P > 0) pay = r === 0 ? (P - B) / n : (P - B / Math.pow(1 + r, n)) * r / (1 - Math.pow(1 + r, -n));
    // Kustannus ajan hetkellä t = oma raha + tähän mennessä maksettu + jäljellä oleva laina.
    var cost = [down + P], paidSeries = [down], bal = P, paid = down;
    for (var t = 1; t <= n; t++) {
      bal = bal * (1 + r) - pay;
      paid += pay + fee;
      if (t === n) { paid += B; bal -= B; }
      if (Math.abs(bal) < 0.005) bal = 0;
      cost.push(paid + Math.max(bal, 0));
      paidSeries.push(paid);
    }
    var total = down + n * (pay + fee) + B;           // luottohinta
    // Todellinen vuosikorko: kuukausittainen sisäinen korko luoton määrän ja maksujen välillä.
    var apr = null;
    if (credit > 0) {
      var npv = function (i) {
        var v = -credit, d = 1;
        for (var k = 1; k <= n; k++) { d /= (1 + i); v += (pay + fee + (k === n ? B : 0)) * d; }
        return v;
      };
      var lo = 0, hi = 1;
      if (npv(0) <= 0) apr = 0;
      else {
        for (var it = 0; it < 200; it++) { var mid = (lo + hi) / 2; if (npv(mid) > 0) lo = mid; else hi = mid; }
        apr = (Math.pow(1 + (lo + hi) / 2, 12) - 1) * 100;
      }
    }
    return { P: P, credit: credit, pay: pay, payTotal: P > 0 ? pay + fee : 0, fee: fee, balloon: B, total: total, costs: total - price, apr: apr, cost: cost, paid: paidSeries, n: n, price: price };
  }
  // Ensimmäinen kohta, jossa autojen kustannuskäyrät vaihtavat järjestystä.
  function rfCross(a, b) {
    for (var t = 1; t < a.cost.length; t++) {
      var d0 = a.cost[t - 1] - b.cost[t - 1], d1 = a.cost[t] - b.cost[t];
      if (d0 === 0 && t === 1) continue;
      if ((d0 < 0 && d1 >= 0) || (d0 > 0 && d1 <= 0)) {
        var f = d0 / (d0 - d1);
        return { month: t - 1 + f, value: a.cost[t - 1] + (a.cost[t] - a.cost[t - 1]) * f, cheaperAfter: d1 > 0 || (d1 === 0 && d0 < 0) ? "B" : "A" };
      }
    }
    return null;
  }

      ["A", "B"].map(function (id) {

          '<span class="s">Korot ja kulut: <strong data-s="' + id + 'costs"></strong></span><span class="s">Todellinen vuosikorko: <strong data-s="' + id + 'apr"></strong></span></div>';

    var hover = null;
    function update() {

      } else {

  // SVG-kaavio: kaksi viivaa, kuukaudet x-akselilla, euroina y-akselilla.
  function rfDraw(el, a, b, cr, hover) {
    var W = Math.max(el.clientWidth, 280), H = W < 560 ? 260 : 340;
    var pl = W < 560 ? 44 : 56, pr = 14, pt = 12, pb = 34;
    var n = a.n, all = a.cost.concat(b.cost);
    var lo = Math.min.apply(null, all), hi = Math.max.apply(null, all);
    if (hi - lo < 1) { hi = lo + 1000; }
    var span = hi - lo, stepRaw = span / 4, mag = Math.pow(10, Math.floor(Math.log(stepRaw) / Math.LN10));
    var step = [1, 2, 2.5, 5, 10].map(function (m) { return m * mag; }).filter(function (s) { return s >= stepRaw; })[0];
    var y0v = Math.floor(lo / step) * step, y1v = Math.ceil(hi / step) * step;
    if (y1v === y0v) y1v = y0v + step;
    var x0 = pl, x1 = W - pr, yb = H - pb, yt = pt;
    function X(t) { return x0 + (x1 - x0) * t / n; }
    function Y(v) { return yb - (yb - yt) * (v - y0v) / (y1v - y0v); }
    function path(arr) { return arr.map(function (v, t) { return (t ? "L" : "M") + X(t).toFixed(1) + " " + Y(v).toFixed(1); }).join(""); }
    function kfmt(v) { return v >= 1000 ? (Math.round(v / 100) / 10).toLocaleString("fi-FI") + "k" : Math.round(v); }
    var s = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" height="' + H + '" role="img" aria-label="Kustannus ajan myötä, Auto A ja Auto B">';
    for (var v = y0v; v <= y1v + 0.001; v += step) {
      s += '<line class="grid" x1="' + x0 + '" x2="' + x1 + '" y1="' + Y(v) + '" y2="' + Y(v) + '"/>';
      s += '<text class="ax" x="' + (x0 - 6) + '" y="' + (Y(v) + 4) + '" text-anchor="end">' + kfmt(v) + '</text>';
    }
    var xs = n <= 24 ? 6 : (n <= 60 ? 12 : 24);
    for (var t = 0; t <= n; t += xs) s += '<text class="ax" x="' + X(t) + '" y="' + (yb + 18) + '" text-anchor="middle">' + t + '</text>';
    if (n % xs) s += '<text class="ax" x="' + X(n) + '" y="' + (yb + 18) + '" text-anchor="end">' + n + '</text>';
    s += '<text class="ax" x="' + x1 + '" y="' + (H - 2) + '" text-anchor="end">kk</text>';
    s += '<line class="base" x1="' + x0 + '" x2="' + x1 + '" y1="' + yb + '" y2="' + yb + '"/>';
    s += '<path class="ln lb" d="' + path(b.cost) + '"/><path class="ln la" d="' + path(a.cost) + '"/>';
    if (cr) {
      var cx = X(cr.month), cy = Y(cr.value);
      s += '<line class="crossl" x1="' + cx + '" x2="' + cx + '" y1="' + yt + '" y2="' + yb + '"/>';
      s += '<circle class="crossp" cx="' + cx + '" cy="' + cy + '" r="6"/>';
    }
    if (hover !== null && hover !== undefined) {
      var hx = X(hover), va = a.cost[hover], vb = b.cost[hover];
      s += '<line class="hl" x1="' + hx + '" x2="' + hx + '" y1="' + yt + '" y2="' + yb + '"/>';
      s += '<circle class="dot da" cx="' + hx + '" cy="' + Y(va) + '" r="5"/><circle class="dot db" cx="' + hx + '" cy="' + Y(vb) + '" r="5"/>';
    }
    s += '</svg>';
    var tip = "";
    if (hover !== null && hover !== undefined) {
      var d = a.cost[hover] - b.cost[hover];
      var left = X(hover) / W * 100;
      tip = '<div class="rf-tip' + (W < 560 ? ' below' : '') + '" style="' + (W < 560 ? '' : (left > 55 ? 'right:' + (100 - left + 2) + '%' : 'left:' + (left + 2) + '%')) + '"><b>' + hover + ' kk</b>' +
        '<span class="a"><i></i>Auto A <strong>' + eur(a.cost[hover]) + '</strong></span>' +
        '<span class="b"><i></i>Auto B <strong>' + eur(b.cost[hover]) + '</strong></span>' +
        '<span class="d">' + (Math.abs(d) < 1 ? "Yhtä paljon" : "Auto " + (d < 0 ? "A" : "B") + " " + eur(Math.abs(d)) + " edullisempi") + '</span>' +
        '<span class="p">Maksettu tähän mennessä: A ' + eur(a.paid[hover]) + ' · B ' + eur(b.paid[hover]) + '</span></div>';
    }
    el.innerHTML = s + tip;
    el.querySelector("svg").__geom = { W: W, x0: x0, x1: x1, n: n };
  }

  var LS_THEME = "ts_theme";
  var THEME_ICON = {
    sun: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
    moon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>'
  };
  function currentTheme() {
    var t = document.documentElement.getAttribute("data-theme");
    if (t === "light" || t === "dark") return t;
    return window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
  }
  function applyTheme(t) {
    if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
    else document.documentElement.removeAttribute("data-theme");
    var b = document.getElementById("themeBtn");
    var cur = currentTheme();
    // Painike näyttää tilan, johon siirrytään.
    if (b) b.innerHTML = cur === "dark" ? THEME_ICON.sun + '<span class="lbl">Vaalea</span>' : THEME_ICON.moon + '<span class="lbl">Tumma</span>';
    var m = document.querySelector('meta[name="theme-color"]');
    if (!m) { m = document.createElement("meta"); m.name = "theme-color"; document.head.appendChild(m); }
    m.content = cur === "dark" ? "#14171c" : "#f4f5f7";
  }
  (function () {
    var saved = null;
    try { var ls = safeLS(); saved = ls ? ls.getItem(LS_THEME) : null; } catch (e) {}
    applyTheme(saved);
    if (window.matchMedia) {
      var mq = window.matchMedia("(prefers-color-scheme: light)");
      var onChange = function () { if (!document.documentElement.getAttribute("data-theme")) applyTheme(null); };
      if (mq.addEventListener) mq.addEventListener("change", onChange); else if (mq.addListener) mq.addListener(onChange);
    }
  })();
  document.getElementById("themeBtn").addEventListener("click", function () {
    var next = currentTheme() === "dark" ? "light" : "dark";
    try { var ls = safeLS(); if (ls) ls.setItem(LS_THEME, next); } catch (e) {}
    applyTheme(next);
    showToast(next === "dark" ? "Tumma tila" : "Vaalea tila");
  });

  setInterval(function () {
    var k = monthKeyOf(new Date());
    if (k !== state.monthKey) {
      state.monthKey = k;
      localOffers = (curMonthDoc() && curMonthDoc().offers) ? curMonthDoc().offers.slice() : null;
      deletedIds = {};
      render();
    }
  }, 60000);

  render();
  initAuth();
})();
</script>
