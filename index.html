<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tarjousseuranta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #14171c;
    --surface: #1c2028;
    --surface-2: #242933;
    --border: #333a46;
    --text: #eef0f3;
    --text-dim: #9aa2b1;
    --text-faint: #5c6473;
    --accent: #ff6a1f;
    --accent-dim: #ff6a1f33;
    --good: #3ecf8e;
    --good-dim: #3ecf8e26;
    --bad: #ef5354;
    --bad-dim: #ef535426;
    --gold: #e8b93e;
    --gold-dim: #e8b93e22;
    --font-display: 'Oswald', 'Arial Narrow', sans-serif;
    --font-body: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  :root:not([data-theme="light"]) { color-scheme: dark; }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #f4f5f7;
      --surface: #ffffff;
      --surface-2: #eceef2;
      --border: #dcdfe5;
      --text: #171a1f;
      --text-dim: #5c6473;
      --text-faint: #9aa2b1;
      --accent: #e85e18;
      --accent-dim: #e85e1822;
      --good: #1c9a63;
      --good-dim: #1c9a6318;
      --bad: #d93c3d;
      --bad-dim: #d93c3d18;
      --gold: #a9791a;
      --gold-dim: #a9791a18;
      color-scheme: light;
    }
  }
  :root[data-theme="light"] {
    --bg: #f4f5f7;
    --surface: #ffffff;
    --surface-2: #eceef2;
    --border: #dcdfe5;
    --text: #171a1f;
    --text-dim: #5c6473;
    --text-faint: #9aa2b1;
    --accent: #e85e18;
    --accent-dim: #e85e1822;
    --good: #1c9a63;
    --good-dim: #1c9a6318;
    --bad: #d93c3d;
    --bad-dim: #d93c3d18;
    --gold: #a9791a;
    --gold-dim: #a9791a18;
    color-scheme: light;
  }
  :root[data-theme="dark"] { color-scheme: dark; }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    min-height: 100vh;
    overflow-x: hidden;
  }
  #app {
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    padding-bottom: 84px;
  }
  #app.auth-mode { padding-bottom: 0; }

  /* header */
  header.top {
    padding: 20px 18px 14px;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
    gap: 10px;
  }
  header.top .brand {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 20px;
    letter-spacing: 0.02em;
  }
  header.top .month-label {
    font-size: 13px;
    color: var(--text-dim);
    text-transform: capitalize;
  }
  header.top .who-label {
    font-size: 12px;
    color: var(--text-faint);
    margin-top: 2px;
  }
  .hdr-btns { display: flex; gap: 8px; flex-shrink: 0; }
  #themeBtn {
    background: var(--surface-2); border: 1px solid var(--border); color: var(--text);
    border-radius: 10px; height: 38px; padding: 0 12px; cursor: pointer; flex-shrink: 0;
    display: flex; align-items: center; gap: 7px; font-family: var(--font-body); font-size: 13px; font-weight: 600;
  }
  #themeBtn svg { width: 18px; height: 18px; }
  @media (max-width: 400px) { #themeBtn .lbl { display: none; } #themeBtn { width: 38px; padding: 0; justify-content: center; } }
  #settingsBtn {
    background: var(--surface-2); border: 1px solid var(--border); color: var(--text);
    border-radius: 10px; width: 38px; height: 38px; flex-shrink: 0; cursor: pointer;
    display: none; align-items: center; justify-content: center;
  }
  #settingsBtn svg { width: 18px; height: 18px; }

  main { flex: 1; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
  main.auth-main { justify-content: center; min-height: 100vh; padding: 24px; }

  /* generic card */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px;
  }
  .card h2 {
    font-family: var(--font-display);
    font-size: 15px;
    font-weight: 500;
    margin: 0 0 4px;
    color: var(--text-dim);
  }

  /* auth screen */
  .auth-card { max-width: 400px; margin: 0 auto; width: 100%; }
  .auth-brand { text-align: center; margin-bottom: 22px; }
  .auth-brand .icon {
    width: 56px; height: 56px; border-radius: 16px; background: var(--accent-dim);
    color: var(--accent); display: flex; align-items: center; justify-content: center;
    margin: 0 auto 12px; font-family: var(--font-display); font-size: 26px; font-weight: 600;
  }
  .auth-brand h1 { font-family: var(--font-display); font-size: 22px; font-weight: 600; margin: 0; }
  .auth-toggle { display: flex; gap: 8px; margin-top: 14px; }
  .auth-toggle button {
    flex: 1; background: var(--surface-2); border: 1px solid var(--border); color: var(--text-dim);
    border-radius: 10px; padding: 10px; font-size: 13px; font-weight: 600; cursor: pointer; font-family: var(--font-body);
  }
  .auth-toggle button.active { background: var(--accent-dim); color: var(--accent); border-color: var(--accent); }
  .auth-error { color: var(--bad); font-size: 13px; margin: -6px 0 14px; }
  .auth-link { text-align: center; font-size: 13px; color: var(--text-faint); margin-top: 14px; }
  .auth-link a { color: var(--accent); text-decoration: none; cursor: pointer; }

  /* gauge / hero */
  .gauge-card { display: flex; align-items: center; gap: 18px; }
  .gauge-wrap { position: relative; width: 128px; height: 128px; flex-shrink: 0; }
  .gauge-wrap svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .gauge-wrap .ring-bg { fill: none; stroke: var(--surface-2); stroke-width: 10; }
  .gauge-wrap .ring-fg { fill: none; stroke: var(--accent); stroke-width: 10; stroke-linecap: round; transition: stroke-dashoffset .5s ease, stroke .3s ease; }
  .gauge-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .gauge-center .num { font-family: var(--font-display); font-size: 30px; font-weight: 600; line-height: 1; }
  .gauge-center .den { font-size: 11px; color: var(--text-dim); margin-top: 2px; }
  .gauge-side { flex: 1; min-width: 0; }
  .pace-tag {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 13px; font-weight: 600; padding: 5px 10px; border-radius: 999px;
    margin-bottom: 8px;
  }
  .pace-tag.ahead { background: var(--good-dim); color: var(--good); }
  .pace-tag.behind { background: var(--bad-dim); color: var(--bad); }
  .pace-tag.onpace { background: var(--accent-dim); color: var(--accent); }
  .gauge-side .detail { font-size: 13px; color: var(--text-dim); line-height: 1.5; }
  .gauge-side .detail b { color: var(--text); font-weight: 600; }

  /* stat row */
  .stat-row { display: flex; gap: 10px; }
  .stat-box {
    flex: 1; background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    padding: 14px; text-align: left;
  }
  .stat-box .n { font-family: var(--font-display); font-size: 26px; font-weight: 600; }
  .stat-box .l { font-size: 12px; color: var(--text-dim); margin-top: 2px; }

  /* source table */
  table.src { width: 100%; border-collapse: collapse; margin-top: 8px; }
  table.src th, table.src td { text-align: left; padding: 8px 4px; font-size: 13px; border-bottom: 1px solid var(--border); }
  table.src th { color: var(--text-faint); font-weight: 500; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; }
  table.src td:not(:first-child), table.src th:not(:first-child) { text-align: right; }
  table.src tr:last-child td { border-bottom: none; }
  table.src td.hr-good { color: var(--good); font-weight: 600; }
  table.src td.hr-bad { color: var(--text-dim); }

  /* buttons */
  .btn {
    font-family: var(--font-body); font-weight: 600; font-size: 15px;
    border-radius: 12px; border: none; padding: 14px 16px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    width: 100%;
  }
  .btn-primary { background: var(--accent); color: #17110b; }
  .btn-primary:active { opacity: .85; }
  .btn-primary:disabled { opacity: .5; cursor: default; }
  .btn-ghost { background: var(--surface-2); color: var(--text); border: 1px solid var(--border); }
  .btn-ghost:active { background: var(--border); }
  .btn-sm { padding: 9px 14px; font-size: 13px; width: auto; }

  /* setup form */
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 13px; color: var(--text-dim); margin-bottom: 6px; }
  .field input {
    width: 100%; background: var(--surface-2); border: 1px solid var(--border); color: var(--text);
    font-family: var(--font-display); font-size: 22px; font-weight: 500; border-radius: 10px;
    padding: 10px 12px;
  }
  .field input.text-field { font-family: var(--font-body); font-size: 15px; font-weight: 500; }
  .field input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .field-note { font-size: 12px; color: var(--accent); margin: -6px 0 14px; }
  .field-hint { font-size: 12px; color: var(--text-faint); margin: -10px 0 14px; }

  /* source picker grid */
  .src-grid { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
  .src-pick {
    background: var(--surface-2); border: 1px solid var(--border); color: var(--text);
    border-radius: 12px; padding: 14px; text-align: left; font-size: 14px; font-weight: 500;
    cursor: pointer; display: flex; align-items: center; justify-content: space-between;
  }
  .src-pick:active { background: var(--border); }
  .src-pick .tag { font-size: 11px; color: var(--text-dim); font-weight: 400; }

  /* offer list */
  .offer-list { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
  .offer-row {
    display: flex; align-items: center; justify-content: space-between;
    background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 12px;
  }
  .offer-row .meta { font-size: 13px; }
  .offer-row .meta .src { font-weight: 600; }
  .offer-row .meta .date { color: var(--text-dim); font-size: 12px; margin-top: 1px; }
  .offer-row button {
    background: var(--accent-dim); color: var(--accent); border: none; border-radius: 8px;
    padding: 7px 12px; font-size: 12px; font-weight: 700; cursor: pointer;
  }
  .offer-row .row-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .offer-row .status-badge {
    font-size: 11px; font-weight: 700; padding: 4px 8px; border-radius: 999px;
    background: var(--good-dim); color: var(--good);
  }
  .offer-row .status-badge.open { background: var(--surface); color: var(--text-faint); border: 1px solid var(--border); }
  .del-btn {
    background: var(--bad-dim); color: var(--bad); border: none; border-radius: 8px;
    width: 30px; height: 30px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .del-btn svg { width: 15px; height: 15px; }
  .empty-note { font-size: 13px; color: var(--text-faint); text-align: center; padding: 18px 8px; }

  /* past-month entry form */
  .src-count-row { display: grid; grid-template-columns: 1fr 72px 72px; gap: 8px; align-items: center; margin-bottom: 10px; }
  .src-count-row .lbl { font-size: 13px; }
  .src-count-row input {
    width: 100%; background: var(--surface-2); border: 1px solid var(--border); color: var(--text);
    font-family: var(--font-display); font-size: 16px; font-weight: 500; border-radius: 8px; padding: 8px 6px; text-align: center;
  }
  .src-count-head { display: grid; grid-template-columns: 1fr 72px 72px; gap: 8px; margin-bottom: 6px; }
  .src-count-head span { font-size: 10px; color: var(--text-faint); text-transform: uppercase; letter-spacing: .03em; text-align: center; }
  .src-count-head span:first-child { text-align: left; }
  select.text-field {
    width: 100%; background: var(--surface-2); border: 1px solid var(--border); color: var(--text);
    font-family: var(--font-body); font-size: 15px; font-weight: 500; border-radius: 10px; padding: 10px 12px;
  }

  /* toast */
  #toast {
    position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%) translateY(20px);
    background: var(--text); color: var(--bg); font-size: 13px; font-weight: 600;
    padding: 10px 16px; border-radius: 999px; opacity: 0; pointer-events: none;
    transition: opacity .25s ease, transform .25s ease; z-index: 50; white-space: nowrap;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* history */
  .hist-row {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 14px; margin-bottom: 10px; cursor: pointer;
  }
  .hist-row .top-line { display: flex; justify-content: space-between; align-items: baseline; }
  .hist-row .m { font-family: var(--font-display); font-size: 16px; font-weight: 600; text-transform: capitalize; }
  .hist-row .result { font-size: 13px; color: var(--text-dim); }
  .hist-row .sub { font-size: 12px; color: var(--text-faint); margin-top: 4px; }
  .hist-detail { margin-top: 10px; border-top: 1px solid var(--border); padding-top: 10px; }

  /* leaderboard */
  .lb-tabs { display: flex; gap: 8px; margin-bottom: 4px; }
  .lb-tab {
    flex: 1; background: var(--surface); border: 1px solid var(--border); color: var(--text-dim);
    border-radius: 12px; padding: 12px; font-size: 13px; font-weight: 600; cursor: pointer;
    font-family: var(--font-body);
  }
  .lb-tab.active { background: var(--accent-dim); color: var(--accent); border-color: var(--accent); }
  .lb-list { display: flex; flex-direction: column; gap: 8px; }
  .lb-row {
    display: flex; align-items: center; gap: 12px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 12px 14px;
  }
  .lb-row.self { border-color: var(--accent); background: var(--accent-dim); }
  .lb-row.top1 .lb-rank { color: var(--gold); }
  .lb-rank {
    font-family: var(--font-display); font-size: 18px; font-weight: 600; color: var(--text-faint);
    width: 22px; text-align: center; flex-shrink: 0;
  }
  .lb-info { flex: 1; min-width: 0; }
  .lb-name { font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lb-company { font-size: 12px; color: var(--text-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lb-metric { text-align: right; flex-shrink: 0; }
  .lb-metric .v { font-family: var(--font-display); font-size: 18px; font-weight: 600; }
  .lb-metric .u { font-size: 11px; color: var(--text-dim); margin-top: 1px; }

  /* bottom nav */
  nav.tabbar {
    position: fixed; left: 50%; transform: translateX(-50%); bottom: 0; width: 100%; max-width: 480px;
    background: var(--surface); border-top: 1px solid var(--border);
    display: flex; padding: 8px 8px calc(8px + env(safe-area-inset-bottom));
    gap: 4px;
  }
  nav.tabbar button {
    flex: 1; background: none; border: none; display: flex; flex-direction: column; align-items: center;
    gap: 3px; padding: 6px 0; color: var(--text-faint); font-size: 11px; font-weight: 600; cursor: pointer;
    font-family: var(--font-body);
  }
  nav.tabbar button.active { color: var(--accent); }
  nav.tabbar svg { width: 22px; height: 22px; }
  @media (max-width: 899px) {
    nav.tabbar { gap: 0; padding-left: 2px; padding-right: 2px; overflow-x: auto; scrollbar-width: none; }
    nav.tabbar::-webkit-scrollbar { display: none; }
    nav.tabbar.more-right { -webkit-mask-image: linear-gradient(to right, #000 84%, transparent); mask-image: linear-gradient(to right, #000 84%, transparent); }
    nav.tabbar.more-left { -webkit-mask-image: linear-gradient(to left, #000 84%, transparent); mask-image: linear-gradient(to left, #000 84%, transparent); }
    nav.tabbar.more-left.more-right { -webkit-mask-image: linear-gradient(to right, transparent, #000 14%, #000 86%, transparent); mask-image: linear-gradient(to right, transparent, #000 14%, #000 86%, transparent); }
    nav.tabbar button { flex: 1 0 auto; min-width: 56px; padding-left: 4px; padding-right: 4px; font-size: 10px; letter-spacing: -.1px; }
  }

  .loading-wrap { display: flex; align-items: center; justify-content: center; min-height: 60vh; color: var(--text-faint); font-size: 14px; }
  .hidden { display: none !important; }
  .section-title { font-family: var(--font-display); font-size: 13px; color: var(--text-dim); margin: 4px 2px 0; text-transform: uppercase; letter-spacing: .04em; }

  /* ---------- Myyntirunko ---------- */
  main.runko-main { padding-bottom: 150px; }
  body.rk-on #toast { bottom: calc(140px + env(safe-area-inset-bottom)); }
  .rk-top { display: flex; gap: 8px; align-items: stretch; }
  .rk-seg { flex: 1; display: flex; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 3px; gap: 3px; }
  .rk-seg button {
    flex: 1; background: none; border: none; color: var(--text-dim); font-family: var(--font-display);
    font-size: 15px; font-weight: 500; border-radius: 9px; padding: 9px 6px; cursor: pointer; letter-spacing: .02em;
  }
  .rk-seg button.active { background: var(--accent); color: #17110b; }
  .rk-editbtn {
    background: var(--surface); border: 1px solid var(--border); color: var(--text); border-radius: 12px;
    padding: 0 12px; font-size: 13px; font-weight: 600; cursor: pointer; font-family: var(--font-body);
    display: flex; align-items: center; gap: 6px;
  }
  .rk-editbtn svg { width: 16px; height: 16px; }

  .rk-steps { display: flex; gap: 6px; overflow-x: auto; padding: 2px 1px 4px; scrollbar-width: none; }
  .rk-steps::-webkit-scrollbar { display: none; }
  .rk-chip {
    flex: 0 0 auto; background: var(--surface); border: 1px solid var(--border); color: var(--text-dim);
    border-radius: 999px; padding: 6px 11px; font-size: 12px; font-weight: 600; cursor: pointer;
    font-family: var(--font-body); white-space: nowrap; max-width: 170px; overflow: hidden; text-overflow: ellipsis;
  }
  .rk-chip .n { font-family: var(--font-display); margin-right: 5px; color: var(--text-faint); }
  .rk-chip.done { color: var(--text-faint); }
  .rk-chip.on { background: var(--accent-dim); border-color: var(--accent); color: var(--accent); }
  .rk-chip.on .n { color: var(--accent); }

  .rk-card { padding: 18px 16px 20px; }
  .rk-eyebrow { font-family: var(--font-display); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); }
  .rk-title { font-family: var(--font-display); font-size: 26px; font-weight: 600; line-height: 1.12; margin: 4px 0 2px; }
  .rk-sub { font-size: 13px; color: var(--text-dim); margin-bottom: 4px; }
  .rk-items { display: flex; flex-direction: column; gap: 4px; margin-top: 14px; }
  .rk-q { display: grid; grid-template-columns: 14px 1fr; gap: 8px; font-size: 16px; line-height: 1.45; padding: 7px 0; border-bottom: 1px solid var(--border); }
  .rk-q:last-child { border-bottom: none; }
  .rk-q::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); margin-top: 9px; }
  .rk-h { font-family: var(--font-display); font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--text-dim); margin: 14px 0 2px; }
  .rk-h:first-child { margin-top: 0; }
  .rk-tip { background: var(--accent-dim); border-left: 3px solid var(--accent); border-radius: 8px; padding: 10px 12px; font-size: 15px; line-height: 1.45; font-weight: 600; margin: 6px 0; }
  .rk-say { background: var(--good-dim); border-radius: 12px 12px 12px 4px; padding: 10px 12px; font-size: 16px; line-height: 1.45; margin: 6px 0; }
  .rk-say .lbl { display: block; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--good); margin-bottom: 2px; }
  .rk-kv { display: flex; justify-content: space-between; gap: 12px; font-size: 16px; padding: 9px 12px; background: var(--surface-2); border-radius: 8px; }
  .rk-kv .k { color: var(--text-dim); }
  .rk-kv .v { font-weight: 600; text-align: right; }
  .rk-own { font-size: 10px; font-weight: 700; color: var(--gold); background: var(--gold-dim); border-radius: 999px; padding: 1px 6px; margin-left: 6px; vertical-align: 2px; }

  .rk-next {
    position: fixed; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px;
    bottom: calc(66px + env(safe-area-inset-bottom)); padding: 8px 12px; z-index: 20;
    background: linear-gradient(to top, var(--bg) 70%, transparent);
  }
  .rk-next-inner { display: flex; gap: 8px; align-items: stretch; }
  .rk-prev {
    background: var(--surface); border: 1px solid var(--border); color: var(--text); border-radius: 12px;
    width: 52px; flex-shrink: 0; cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  .rk-prev:disabled { opacity: .35; cursor: default; }
  .rk-prev svg, .rk-fwd svg { width: 20px; height: 20px; }
  .rk-fwd {

  .vt-risk b { display: block; font-size: 16px; color: var(--risk); }
  .vt-risk span { font-size: 13px; color: var(--text-dim); }
  .vt-rec { border-radius: 12px; padding: 12px 14px; background: var(--surface-2); }
  .vt-rec .l { display: block; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--text-dim); }
  .vt-rec b { font-family: var(--font-display); font-size: 22px; font-weight: 600; }
  .vt-b { margin-top: 12px; }
  .vt-b .h { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--text-dim); margin-bottom: 4px; }

  .vt-b.good li::marker { color: var(--good); }

  #vtCopy { margin-top: 16px; }
  @media (min-width: 560px) { .vt-checks { grid-template-columns: 1fr 1fr; } }
  @media (min-width: 900px) {
    main.vt-main { display: grid; grid-template-columns: minmax(0, 1fr) 380px; align-items: start; gap: 20px; }
    .vt-mini { display: none; }
    .vt-col { grid-column: 1; }
    .vt-sum { grid-column: 2; grid-row: 1; position: sticky; top: 24px; max-height: calc(100vh - 48px); overflow-y: auto; }
  }

  /* ---------- Rahoituslaskuri ---------- */
  :root { --ser-a: #e0621f; --ser-b: #5f8ad0; }
  @media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) { --ser-a: #e85e18; --ser-b: #3f6db3; } }
  :root[data-theme="light"] { --ser-a: #e85e18; --ser-b: #3f6db3; }
  :root[data-theme="dark"] { --ser-a: #e0621f; --ser-b: #5f8ad0; }
  .rf-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  .rf-head h2 { font-family: var(--font-display); font-size: 20px; font-weight: 600; margin: 0; }

  .rf-b { --ser: var(--ser-b); }
  .rf-ct { display: flex; align-items: center; gap: 8px; font-family: var(--font-display); font-size: 17px; font-weight: 600; margin-bottom: 10px; }
  .rf-ct .sw { width: 12px; height: 12px; border-radius: 50%; background: var(--ser); }

  .rf-num { display: flex; align-items: center; gap: 4px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; padding: 0 8px; flex-shrink: 0; }
  .rf-num:focus-within { border-color: var(--ser); }
  .rf-num input { width: 78px; background: none; border: none; outline: none; color: var(--text); font-family: var(--font-body); font-size: 15px; font-weight: 600; text-align: right; padding: 7px 0; }
  .rf-num em { font-style: normal; font-size: 12px; color: var(--text-faint); }
  .rf-range { -webkit-appearance: none; appearance: none; width: 100%; height: 30px; background: transparent; margin: 2px 0 0; cursor: pointer; }
  .rf-range::-webkit-slider-runnable-track { height: 6px; border-radius: 3px; border: 1px solid var(--border); background: linear-gradient(to right, var(--ser, var(--accent)) 0 var(--pct, 0%), var(--surface-2) var(--pct, 0%) 100%); }
  .rf-range::-moz-range-track { height: 6px; border-radius: 3px; background: var(--surface-2); border: 1px solid var(--border); }
  .rf-range::-moz-range-progress { height: 6px; border-radius: 3px; background: var(--ser, var(--accent)); }
  .rf-range::-webkit-slider-thumb { -webkit-appearance: none; width: 24px; height: 24px; border-radius: 50%; background: var(--surface); border: 3px solid var(--ser, var(--accent)); margin-top: -10px; box-shadow: 0 1px 4px rgba(0,0,0,.25); }
  .rf-range::-moz-range-thumb { width: 18px; height: 18px; border-radius: 50%; background: var(--surface); border: 3px solid var(--ser, var(--accent)); }
  .rf-range:focus-visible { outline: 2px solid var(--ser, var(--accent)); outline-offset: 2px; border-radius: 6px; }
  .rf-out { margin-top: 10px; background: var(--surface-2); border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 4px; }

  .rf-ch-head { display: flex; flex-direction: column; gap: 12px; }

  .rf-plot .lb { stroke: var(--ser-b); }

  .rf-plot .crossp { fill: var(--good); stroke: var(--surface); stroke-width: 3; }

  .rf-plot .dot { stroke: var(--surface); stroke-width: 2; }
  .rf-plot .da { fill: var(--ser-a); }
  .rf-plot .db { fill: var(--ser-b); }
  .rf-tip { position: absolute; top: 4px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 8px 10px; box-shadow: 0 6px 20px rgba(0,0,0,.2);
    display: flex; flex-direction: column; gap: 3px; font-size: 12.5px; color: var(--text-dim); pointer-events: none; min-width: 170px; z-index: 2; }
  .rf-tip b { color: var(--text); font-size: 13px; }
  .rf-tip span { display: flex; align-items: center; gap: 6px; }
  .rf-tip i { width: 10px; height: 3px; border-radius: 2px; display: inline-block; }
  .rf-tip strong { margin-left: auto; color: var(--text); padding-left: 10px; }
  .rf-tip .d { color: var(--text); font-weight: 600; border-top: 1px solid var(--border); padding-top: 4px; margin-top: 2px; }

  .rf-stats { display: grid; grid-template-columns: 1fr; gap: 10px; }
  .rf-stat { display: flex; flex-direction: column; gap: 3px; padding: 14px 16px; }
  .rf-stat.rf-a, .rf-stat.rf-b { border-left: 4px solid var(--ser); }

  .rf-stat b { font-family: var(--font-display); font-size: 24px; font-weight: 600; }
  .rf-stat b.hit { color: var(--good); }
  .rf-stat.cross b:not(.hit) { color: var(--good); font-size: 20px; }
  .rf-stat .s { font-size: 12.5px; color: var(--text-dim); line-height: 1.4; }

  @media (min-width: 700px) {
    .rf-cars { grid-template-columns: 1fr 1fr; }

    .rf-ch-head { flex-direction: row; justify-content: space-between; align-items: flex-start; }

  }
  /* edit mode */
  .rk-edit-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .rk-edit-head h2 { font-family: var(--font-display); font-size: 20px; font-weight: 600; margin: 0; color: var(--text); }

  .rk-erow {

    border-radius: 12px; padding: 8px 8px 8px 12px;

  .rk-erow .txt b { font-weight: 600; }
  .rk-ib {
    width: 34px; height: 34px; flex-shrink: 0; background: var(--surface-2); border: 1px solid var(--border); color: var(--text);
    border-radius: 9px; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0;
  }

  }
  .rk-kinds button.on { background: var(--accent-dim); border-color: var(--accent); color: var(--accent); }
</style>
</head>

<script>
(function () {
  "use strict";

  var SOURCES = [
    { id: 1, label: "Firman liidi" },
    { id: 2, label: "Lattialle tullut asiakas" },
    { id: 3, label: "Suorasoitto" },
    { id: 4, label: "Itse kontaktoitu" },
    { id: 5, label: "Muu oma väylä" }
  ];
  var MONTH_NAMES = ["tammikuu","helmikuu","maaliskuu","huhtikuu","toukokuu","kesäkuu",
    "heinäkuu","elokuu","syyskuu","lokakuu","marraskuu","joulukuu"];

  var LS_API = "ts_api_url";
  var LS_NICK = "ts_nickname";
  var LS_PIN = "ts_pin";

  var state = {
    apiUrl: null,
    authStatus: "checking", // need-api | checking | need-auth | ready
    authMode: "login",      // login | register
    authError: "",
    authBusy: false,
    tab: "home",
    monthKey: monthKeyOf(new Date()),
    profile: null,          // { nickname, company, months: {...} } once logged in
    pin: null,              // kept in memory for this session's writes
    leaderboardTab: "hitrate",
    leaderboardPeriod: "month",
    leaderboardDocs: [],
    leaderboardLoaded: false,
    leaderboardTimer: null,
    historyExpanded: null
  };

  // Local authoritative offers array (current month) + serialized write
  // queue, and sticky-deleted ids so a slow/late server echo can never
  // resurrect something the user just deleted.
  var localOffers = null;
  var writeChain = Promise.resolve();
  var deletedIds = {};

  function monthKeyOf(d) {
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0");
  }
  function parseMonthKey(k) {
    var parts = k.split("-");
    return { y: parseInt(parts[0], 10), m: parseInt(parts[1], 10) - 1 };
  }
  function isWeekday(d) { var wd = d.getDay(); return wd !== 0 && wd !== 6; }
  function totalWeekdaysInMonth(y, m) {
    var days = new Date(y, m + 1, 0).getDate();
    var c = 0;
    for (var i = 1; i <= days; i++) { if (isWeekday(new Date(y, m, i))) c++; }
    return c;
  }
  function elapsedWeekdaysInMonth(y, m, today) {
    var lastDay = new Date(y, m + 1, 0).getDate();
    var endDay = (today.getFullYear() === y && today.getMonth() === m) ? today.getDate() : lastDay;
    if (today < new Date(y, m, 1)) endDay = 0;
    if (today >= new Date(y, m + 1, 1)) endDay = lastDay;
    var c = 0;
    for (var i = 1; i <= endDay; i++) { if (isWeekday(new Date(y, m, i))) c++; }
    return c;
  }
  function fmtDate(iso) {
    var d = new Date(iso);
    return d.toLocaleDateString("fi-FI", { day: "numeric", month: "numeric" }) + " klo " +
      d.toLocaleTimeString("fi-FI", { hour: "2-digit", minute: "2-digit" });
  }
  function sourceLabel(id) {
    var s = SOURCES.find(function (s) { return s.id === id; });
    return s ? s.label : "Muu";
  }
  function genId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
  function escapeHtml(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function safeLS() {
    try { return window.localStorage; } catch (e) { return null; }
  }

  function showToast(msg) {
    var t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(showToast._h);
    showToast._h = setTimeout(function () { t.classList.remove("show"); }, 1800);
  }

  // ---------- Backend (Google Apps Script) ----------
  function apiCall(action, payload) {
    var body = Object.assign({ action: action }, payload || {});
    return fetch(state.apiUrl, { method: "POST", body: JSON.stringify(body) })
      .then(function (r) { return r.json(); });
  }

  // Kiinteä oletusosoite — vaihda tähän oma Apps Script Web app -URL jos
  // se joskus muuttuu (esim. deployataksesi uuden erillisen kopion).
  var DEFAULT_API_URL = "https://script.google.com/macros/s/AKfycbx10v59MZZN9WHwhvOMhIXCZ465Gyap-UeN0x6zyqDElS0UIktwmyjC_LnTqPjHjf12/exec";

  function resolveApiUrl() {
    var ls = safeLS();
    try {
      var params = new URLSearchParams(window.location.search);
      var fromQuery = params.get("api");
      if (fromQuery) {
        if (ls) ls.setItem(LS_API, fromQuery);
        return fromQuery;
      }
    } catch (e) {}
    var stored = ls ? ls.getItem(LS_API) : null;
    return stored || DEFAULT_API_URL;
  }

  function initAuth() {
    state.apiUrl = resolveApiUrl();
    if (!state.apiUrl) { state.authStatus = "need-api"; render(); return; }
    var ls = safeLS();
    var nick = ls ? ls.getItem(LS_NICK) : null;
    var pin = ls ? ls.getItem(LS_PIN) : null;
    if (!nick || !pin) { state.authStatus = "need-auth"; render(); return; }
    state.authStatus = "checking";
    render();
    apiCall("login", { nickname: nick, pin: pin }).then(function (res) {
      if (res && res.ok) {
        state.profile = res.profile;
        state.pin = pin;
        localOffers = (res.profile.months && res.profile.months[state.monthKey]) ? res.profile.months[state.monthKey].offers : null;
        state.authStatus = "ready";
        render();
        compactOldMonthsIfNeeded().catch(function () {});
      } else {
        if (ls) { ls.removeItem(LS_NICK); ls.removeItem(LS_PIN); }
        state.authStatus = "need-auth";
        state.authError = "Kirjautuminen vanhentui, kirjaudu uudelleen.";
        render();
      }
    }).catch(function () {
      state.authStatus = "need-auth";
      state.authError = "Palvelimeen ei saatu yhteyttä. Tarkista verkkoyhteys ja yritä uudelleen.";
      render();
    });
  }

  function saveApiUrlManually(url) {
    var ls = safeLS();
    if (ls) ls.setItem(LS_API, url);
    state.apiUrl = url;
    state.authStatus = "need-auth";
    render();
  }

  function doLogin(nickname, pin) {
    state.authBusy = true; state.authError = ""; render();
    apiCall("login", { nickname: nickname, pin: pin }).then(function (res) {
      state.authBusy = false;
      if (res && res.ok) {
        var ls = safeLS();
        if (ls) { ls.setItem(LS_NICK, nickname); ls.setItem(LS_PIN, pin); }
        state.profile = res.profile;
        state.pin = pin;
        localOffers = (res.profile.months && res.profile.months[state.monthKey]) ? res.profile.months[state.monthKey].offers : null;
        state.authStatus = "ready";
        render();
        compactOldMonthsIfNeeded().catch(function () {});
      } else if (res && res.error === "not_found") {
        state.authError = "Nimimerkkiä ei löydy. Luo ensin profiili.";
        render();
      } else if (res && res.error === "bad_pin") {
        state.authError = "Väärä PIN-koodi.";
        render();
      } else {
        state.authError = "Kirjautuminen epäonnistui, yritä uudelleen.";
        render();
      }
    }).catch(function () {
      state.authBusy = false;
      state.authError = "Palvelimeen ei saatu yhteyttä.";
      render();
    });
  }

  function doRegister(nickname, company, pin, workDays, targetOffers) {
    state.authBusy = true; state.authError = ""; render();
    apiCall("register", { nickname: nickname, company: company, pin: pin }).then(function (res) {
      if (!(res && res.ok)) {
        state.authBusy = false;
        state.authError = res && res.error === "taken" ? "Nimimerkki on jo käytössä." :
          res && res.error === "pin_too_short" ? "PIN-koodin pitää olla vähintään 4 merkkiä." :
          "Profiilin luonti epäonnistui.";
        render();
        return;
      }
      var monthsObj = {};
      monthsObj[state.monthKey] = { monthKey: state.monthKey, workDays: workDays, targetOffers: targetOffers, offers: [] };
      apiCall("saveMonths", { nickname: nickname, pin: pin, months: monthsObj }).then(function (res2) {
        state.authBusy = false;
        var ls = safeLS();
        if (ls) { ls.setItem(LS_NICK, nickname); ls.setItem(LS_PIN, pin); }
        state.pin = pin;
        state.profile = (res2 && res2.ok) ? res2.profile : { nickname: nickname, company: company, months: monthsObj };
        localOffers = [];
        state.authStatus = "ready";
        render();
        showToast("Tervetuloa, " + nickname + "!");
      }).catch(function () {
        state.authBusy = false;
        var ls = safeLS();
        if (ls) { ls.setItem(LS_NICK, nickname); ls.setItem(LS_PIN, pin); }
        state.pin = pin;
        state.profile = { nickname: nickname, company: company, months: monthsObj };
        localOffers = [];
        state.authStatus = "ready";
        render();
      });
    }).catch(function () {
      state.authBusy = false;
      state.authError = "Palvelimeen ei saatu yhteyttä.";
      render();
    });
  }

  function logout() {
    var ls = safeLS();
    if (ls) { ls.removeItem(LS_NICK); ls.removeItem(LS_PIN); }
    state.profile = null;
    state.pin = null;
    localOffers = null;
    deletedIds = {};
    state.authMode = "login";
    state.authError = "";
    state.authStatus = "need-auth";
    render();
  }

  function queueSaveMonths(monthsPatch) {
    var stepPromise = writeChain.then(function () {
      return apiCall("saveMonths", { nickname: state.profile.nickname, pin: state.pin, months: monthsPatch }).then(function (res) {
        if (!res || !res.ok) {
          throw new Error((res && (res.message || res.error)) || "save_failed");
        }
        return res;
      });
    });
    writeChain = stepPromise.then(function () {}, function () {});
    return stepPromise;
  }

  function fetchLeaderboard() {
    apiCall("leaderboard", {}).then(function (res) {
      if (res && res.ok) {
        state.leaderboardDocs = res.sellers || [];
      }
      state.leaderboardLoaded = true;
      if (state.tab === "leaderboard") render();
    }).catch(function () {
      state.leaderboardLoaded = true;
    });
  }

  function createProfileAndMonth(nickname, company, pin, workDays, targetOffers) {
    doRegister(nickname, company, pin, workDays, targetOffers);
  }

  function startMonthOnly(workDays, targetOffers) {
    var monthsObj = {};
    monthsObj[state.monthKey] = { monthKey: state.monthKey, workDays: workDays, targetOffers: targetOffers, offers: [] };
    localOffers = [];
    state.profile = Object.assign({}, state.profile, { months: Object.assign({}, state.profile.months, monthsObj) });
    render();
    return queueSaveMonths(monthsObj);
  }

  function updateProfileAndGoal(company, workDays, targetOffers) {
    var monthPatch = {};
    monthPatch[state.monthKey] = { workDays: workDays, targetOffers: targetOffers };
    var curMonths = (state.profile && state.profile.months) ? state.profile.months : {};
    var mergedCur = Object.assign({ monthKey: state.monthKey }, curMonths[state.monthKey], monthPatch[state.monthKey]);
    var newMonths = Object.assign({}, curMonths);
    newMonths[state.monthKey] = mergedCur;
    state.profile = Object.assign({}, state.profile, { company: company, months: newMonths });
    render();
    return queueSaveMonths(monthPatch);
  }

  function addOffer(sourceId) {
    if (!localOffers) localOffers = (curMonthDoc() && curMonthDoc().offers) ? curMonthDoc().offers.slice() : [];
    localOffers = localOffers.concat([{ id: genId(), ts: new Date().toISOString(), source: sourceId, closed: false, closedTs: null }]);
    setLocalOffersOnProfile();
    render();
    var patch = {}; patch[state.monthKey] = { offers: localOffers.slice() };
    return queueSaveMonths(patch);
  }

  function closeOffer(offerId) {
    if (!localOffers) localOffers = (curMonthDoc() && curMonthDoc().offers) ? curMonthDoc().offers.slice() : [];
    var idx = localOffers.findIndex(function (o) { return o.id === offerId; });
    if (idx === -1) return Promise.resolve();
    localOffers = localOffers.slice();
    localOffers[idx] = Object.assign({}, localOffers[idx], { closed: true, closedTs: new Date().toISOString() });
    setLocalOffersOnProfile();
    render();
    var patch = {}; patch[state.monthKey] = { offers: localOffers.slice() };
    return queueSaveMonths(patch);
  }

  function deleteOffer(offerId) {
    deletedIds[offerId] = true;
    if (!localOffers) localOffers = (curMonthDoc() && curMonthDoc().offers) ? curMonthDoc().offers.slice() : [];
    var idx = localOffers.findIndex(function (o) { return o.id === offerId; });
    if (idx === -1) return Promise.resolve();
    localOffers = localOffers.slice();
    localOffers.splice(idx, 1);
    setLocalOffersOnProfile();
    render();
    var patch = {}; patch[state.monthKey] = { offers: localOffers.slice() };
    return queueSaveMonths(patch);
  }

  // Bulk-enter a past month's results as per-source offer/deal counts.
  // Stored compactly (just the counts) rather than as exploded per-offer
  // records, since past months only ever need totals/hitrate — this keeps
  // the Sheet cell (50 000 character limit per cell) from filling up as
  // more months accumulate over a season. The one exception is the
  // CURRENT month, which still needs per-offer detail for the daily
  // add/close/delete UI, so that one is still exploded.
  function savePastMonth(monthKey, workDays, targetOffers, sourceCounts) {
    var monthsObj = {};
    if (monthKey === state.monthKey) {
      var parsed = parseMonthKey(monthKey);
      var offers = [];
      var i = 0;
      sourceCounts.forEach(function (sc) {
        for (var n = 0; n < sc.offerCount; n++) {
          var closed = n < sc.dealCount;
          var ts = new Date(parsed.y, parsed.m, 1, 9, 0, 0);
          ts.setMinutes(ts.getMinutes() + i * 7);
          offers.push({
            id: genId(), ts: ts.toISOString(), source: sc.sourceId,
            closed: closed, closedTs: closed ? ts.toISOString() : null
          });
          i++;
        }
      });
      monthsObj[monthKey] = { monthKey: monthKey, workDays: workDays, targetOffers: targetOffers, offers: offers, bySourceCounts: [] };
      localOffers = offers;
    } else {
      monthsObj[monthKey] = { monthKey: monthKey, workDays: workDays, targetOffers: targetOffers, bySourceCounts: sourceCounts, offers: [] };
    }
    var newMonths = Object.assign({}, (state.profile && state.profile.months) || {}, monthsObj);
    state.profile = Object.assign({}, state.profile, { months: newMonths });
    render();
    return queueSaveMonths(monthsObj);
  }

  // One-time cleanup: any already-stored month (other than the current one)
  // that still has old-style exploded offers[] gets compacted down to
  // bySourceCounts, freeing up space in the Sheet cell.
  function compactOldMonthsIfNeeded() {
    var months = (state.profile && state.profile.months) || {};
    var patch = {};
    var changed = false;
    Object.keys(months).forEach(function (key) {
      if (key === state.monthKey) return;
      var doc = months[key];
      if (doc && doc.offers && doc.offers.length > 0) {
        patch[key] = {
          monthKey: key, workDays: doc.workDays, targetOffers: doc.targetOffers,
          bySourceCounts: offersToCounts(doc.offers), offers: []
        };
        changed = true;
      }
    });
    if (!changed) return Promise.resolve();
    var newMonths = Object.assign({}, months);
    Object.keys(patch).forEach(function (k) { newMonths[k] = Object.assign({}, newMonths[k], patch[k]); });
    state.profile = Object.assign({}, state.profile, { months: newMonths });
    return queueSaveMonths(patch);
  }

  function setLocalOffersOnProfile() {
    var curMonths = (state.profile && state.profile.months) ? state.profile.months : {};
    var newMonths = Object.assign({}, curMonths);
    newMonths[state.monthKey] = Object.assign({ monthKey: state.monthKey }, newMonths[state.monthKey], { offers: localOffers });
    state.profile = Object.assign({}, state.profile, { months: newMonths });
  }

  function curMonthDoc() {
    return (state.profile && state.profile.months) ? state.profile.months[state.monthKey] : null;
  }

  // Turn a detailed per-offer array into compact per-source counts.
  function offersToCounts(offers) {
    var m = {};
    (offers || []).forEach(function (o) {
      if (!m[o.source]) m[o.source] = { sourceId: o.source, offerCount: 0, dealCount: 0 };
      m[o.source].offerCount++;
      if (o.closed) m[o.source].dealCount++;
    });
    return Object.keys(m).map(function (k) { return m[k]; });
  }

  // ---------- Derived stats ----------
  // A month doc is either detailed (doc.offers: per-offer records, used for
  // the current month so single entries can be added/closed/deleted) or
  // compact (doc.bySourceCounts: aggregate counts, used for past months
  // added via "Lisää mennyt kuukausi" — no per-offer detail is ever shown
  // for those, so storing it would only waste space in the Sheet cell).
  function computeStats(doc) {
    var offers = (doc && doc.offers && doc.offers.length > 0) ? doc.offers : null;
    var counts = (doc && doc.bySourceCounts && doc.bySourceCounts.length > 0) ? doc.bySourceCounts : null;
    var total, closed, bySource;

    if (offers) {
      total = offers.length;
      closed = offers.filter(function (o) { return o.closed; }).length;
      bySource = SOURCES.map(function (s) {
        var so = offers.filter(function (o) { return o.source === s.id; });
        var sc = so.filter(function (o) { return o.closed; }).length;
        return { id: s.id, label: s.label, count: so.length, closed: sc, rate: so.length > 0 ? (sc / so.length) * 100 : null };
      });
    } else {
      var bySourceId = {};
      (counts || []).forEach(function (c) { bySourceId[c.sourceId] = c; });
      total = (counts || []).reduce(function (a, c) { return a + c.offerCount; }, 0);
      closed = (counts || []).reduce(function (a, c) { return a + c.dealCount; }, 0);
      bySource = SOURCES.map(function (s) {
        var c = bySourceId[s.id];
        var cnt = c ? c.offerCount : 0;
        var cl = c ? c.dealCount : 0;
        return { id: s.id, label: s.label, count: cnt, closed: cl, rate: cnt > 0 ? (cl / cnt) * 100 : null };
      });
    }
    var hitRate = total > 0 ? (closed / total) * 100 : 0;

    var parsed = parseMonthKey(doc ? doc.monthKey : state.monthKey);
    var today = new Date();
    var totalWd = totalWeekdaysInMonth(parsed.y, parsed.m);
    var elapsedWd = elapsedWeekdaysInMonth(parsed.y, parsed.m, today);
    var workDays = doc ? doc.workDays : 0;
    var targetOffers = doc ? doc.targetOffers : 0;
    var elapsedWorkDays = totalWd > 0 ? (workDays * (elapsedWd / totalWd)) : 0;
    var expectedByNow = targetOffers * (totalWd > 0 ? (elapsedWd / totalWd) : 0);
    var diff = total - expectedByNow;
    var remainingWorkDays = Math.max(workDays - elapsedWorkDays, 0);
    var remainingTarget = Math.max(targetOffers - total, 0);
    var neededPerDay = remainingWorkDays > 0 ? (remainingTarget / remainingWorkDays) : (remainingTarget > 0 ? remainingTarget : 0);

    return {
      total: total, closed: closed, hitRate: hitRate,
      totalWd: totalWd, elapsedWd: elapsedWd, elapsedWorkDays: elapsedWorkDays,
      diff: diff, neededPerDay: neededPerDay, remainingWorkDays: remainingWorkDays,
      remainingTarget: remainingTarget, bySource: bySource,
      progressFrac: targetOffers > 0 ? Math.min(total / targetOffers, 1) : 0
    };
  }

  // ---------- Render ----------
  function render() {
    var app = document.getElementById("app");
    var header = document.getElementById("topHeader");
    var tabbar = document.getElementById("tabbar");
    var main = document.getElementById("main");

    if (state.authStatus !== "ready") {
      app.classList.add("auth-mode");
      header.classList.add("hidden");
      tabbar.classList.add("hidden");
      main.className = "auth-main";
      renderAuth(main);
      return;
    }

    app.classList.remove("auth-mode");
    header.classList.remove("hidden");
    tabbar.classList.remove("hidden");
    main.className = "view-" + state.tab;

    document.getElementById("monthLabel").textContent = monthDisplay(state.monthKey);
    var whoLabel = document.getElementById("whoLabel");
    whoLabel.textContent = state.profile.nickname + (state.profile.company ? " · " + state.profile.company : "");
    var settingsBtn = document.getElementById("settingsBtn");
    settingsBtn.style.display = state.tab === "home" ? "flex" : "none";

    main.innerHTML = "";
    document.body.classList.toggle("rk-on", state.tab === "runko");
    if (state.tab === "home") renderHome(main);
    else if (state.tab === "add") renderAdd(main);
    else if (state.tab === "leaderboard") renderLeaderboard(main);
    else if (state.tab === "history") renderHistory(main);
    else if (state.tab === "runko") renderRunko(main);
    else if (state.tab === "liidi") renderLead(main);
    else if (state.tab === "vl") renderVl(main);
    else if (state.tab === "vaihto") renderVt(main);
    else if (state.tab === "rahoitus") renderRf(main);

    Array.prototype.forEach.call(document.querySelectorAll("nav.tabbar button"), function (b) {
      b.classList.toggle("active", b.getAttribute("data-tab") === state.tab);
    });
    // Kapealla puhelimella alavalikko vierii: pidä aktiivinen välilehti näkyvissä.
    navFade();
    var ab = document.querySelector("nav.tabbar button.active"), tb = document.getElementById("tabbar");
    if (ab && tb && tb.scrollWidth > tb.clientWidth) {
      var l = ab.offsetLeft, rgt = l + ab.offsetWidth;
      if (l < tb.scrollLeft) tb.scrollLeft = l - 8; else if (rgt > tb.scrollLeft + tb.clientWidth) tb.scrollLeft = rgt - tb.clientWidth + 8;
    }
  }

  function renderAuth(main) {
    main.innerHTML = "";
    var wrap = document.createElement("div");
    wrap.className = "auth-card";

    if (state.authStatus === "need-api") {
      wrap.innerHTML =
        '<div class="auth-brand"><div class="icon">TS</div><h1>Tarjousseuranta</h1></div>' +
        '<div class="card">' +
          '<h2 style="color:var(--text);font-size:16px;font-weight:600;margin-bottom:10px;">Palvelimen osoite puuttuu</h2>' +
          '<div class="field"><label for="apiInput">Web app -osoite</label><input id="apiInput" class="text-field" type="text" placeholder="https://script.google.com/macros/s/.../exec"></div>' +
          '<button class="btn btn-primary" id="apiSaveBtn">Tallenna</button>' +
        '</div>';
      main.appendChild(wrap);
      wrap.querySelector("#apiSaveBtn").addEventListener("click", function () {
        var url = wrap.querySelector("#apiInput").value.trim();
        if (!url) { showToast("Liitä osoite ensin"); return; }
        saveApiUrlManually(url);
      });
      return;
    }

    if (state.authStatus === "checking") {
      wrap.innerHTML = '<div class="loading-wrap">Kirjaudutaan&hellip;</div>';
      main.appendChild(wrap);
      return;
    }

    // need-auth
    var errHtml = state.authError ? '<div class="auth-error">' + escapeHtml(state.authError) + '</div>' : '';
    if (state.authMode === "login") {
      wrap.innerHTML =
        '<div class="auth-brand"><div class="icon">TS</div><h1>Tarjousseuranta</h1></div>' +
        '<div class="auth-toggle">' +
          '<button type="button" class="active" data-mode="login">Kirjaudu</button>' +
          '<button type="button" data-mode="register">Luo profiili</button>' +
        '</div>' +
        '<div class="card" style="margin-top:14px;">' +
          '<div class="field"><label for="liNick">Nimimerkki</label><input id="liNick" class="text-field" type="text" autocomplete="username"></div>' +
          '<div class="field"><label for="liPin">PIN-koodi</label><input id="liPin" type="password" inputmode="numeric" autocomplete="current-password"></div>' +
          errHtml +
          '<button class="btn btn-primary" id="liBtn"' + (state.authBusy ? " disabled" : "") + '>' + (state.authBusy ? "Kirjaudutaan…" : "Kirjaudu") + '</button>' +
        '</div>';
      main.appendChild(wrap);
      wrap.querySelector("#liBtn").addEventListener("click", function () {
        var nick = wrap.querySelector("#liNick").value.trim();
        var pin = wrap.querySelector("#liPin").value.trim();
        if (!nick || !pin) { showToast("Täytä nimimerkki ja PIN"); return; }
        doLogin(nick, pin);
      });
    } else {
      wrap.innerHTML =
        '<div class="auth-brand"><div class="icon">TS</div><h1>Tarjousseuranta</h1></div>' +
        '<div class="auth-toggle">' +
          '<button type="button" data-mode="login">Kirjaudu</button>' +
          '<button type="button" class="active" data-mode="register">Luo profiili</button>' +
        '</div>' +
        '<div class="card" style="margin-top:14px;">' +
          '<div class="field"><label for="reNick">Nimimerkki</label><input id="reNick" class="text-field" type="text" autocomplete="username"></div>' +
          '<div class="field"><label for="reComp">Autoliike / firma</label><input id="reComp" class="text-field" type="text"></div>' +
          '<div class="field"><label for="rePin">PIN-koodi (väh. 4 merkkiä)</label><input id="rePin" type="password" inputmode="numeric" autocomplete="new-password"></div>' +
          '<div class="field"><label for="reWd">Työpäiviä tässä kuussa</label><input id="reWd" type="number" inputmode="numeric" min="0" placeholder="esim. 20"></div>' +
          '<div class="field"><label for="reTg">Tarjoustavoite kuussa</label><input id="reTg" type="number" inputmode="numeric" min="0" placeholder="esim. 40"></div>' +
          errHtml +
          '<button class="btn btn-primary" id="reBtn"' + (state.authBusy ? " disabled" : "") + '>' + (state.authBusy ? "Luodaan…" : "Luo profiili") + '</button>' +
        '</div>';
      main.appendChild(wrap);
      wrap.querySelector("#reBtn").addEventListener("click", function () {
        var nick = wrap.querySelector("#reNick").value.trim();
        var comp = wrap.querySelector("#reComp").value.trim();
        var pin = wrap.querySelector("#rePin").value.trim();
        var wd = parseInt(wrap.querySelector("#reWd").value, 10);
        var tg = parseInt(wrap.querySelector("#reTg").value, 10);
        if (!nick || !comp || !pin) { showToast("Täytä kaikki kentät"); return; }
        if (!wd || wd <= 0 || !tg || tg <= 0) { showToast("Täytä työpäivät ja tavoite"); return; }
        createProfileAndMonth(nick, comp, pin, wd, tg);
      });
    }
    Array.prototype.forEach.call(wrap.querySelectorAll(".auth-toggle button"), function (b) {
      b.addEventListener("click", function () {
        state.authMode = b.getAttribute("data-mode");
        state.authError = "";
        render();
      });
    });
  }

  function monthDisplay(key) {
    var p = parseMonthKey(key);
    return MONTH_NAMES[p.m] + " " + p.y;
  }

  function renderHome(main) {
    if (!curMonthDoc()) {
      main.appendChild(buildSetupCard());
      main.appendChild(rkHomeButton());
      return;
    }
    var stats = computeStats(curMonthDoc());

    var gcard = document.createElement("div");
    gcard.className = "card gauge-card";
    var r = 54, c = 2 * Math.PI * r;
    var dash = c * stats.progressFrac;
    var ringColor = stats.diff >= 0 ? "var(--good)" : "var(--accent)";
    gcard.innerHTML =
      '<div class="gauge-wrap">' +
        '<svg viewBox="0 0 128 128">' +
          '<circle class="ring-bg" cx="64" cy="64" r="' + r + '"></circle>' +
          '<circle class="ring-fg" cx="64" cy="64" r="' + r + '" style="stroke:' + ringColor + ';stroke-dasharray:' + c + ';stroke-dashoffset:' + (c - dash) + '"></circle>' +
        '</svg>' +
        '<div class="gauge-center"><div class="num">' + stats.total + '</div><div class="den">/ ' + curMonthDoc().targetOffers + '</div></div>' +
      '</div>' +
      '<div class="gauge-side">' +
        paceTagHtml(stats) +
        '<div class="detail">' + paceDetailHtml(stats) + '</div>' +
      '</div>';
    main.appendChild(gcard);
    main.appendChild(rkHomeButton());

    var srow = document.createElement("div");

  function paceTagHtml(stats) {
    var d = Math.round(Math.abs(stats.diff));
    if (stats.total === 0 && stats.elapsedWd === 0) {
      return '<span class="pace-tag onpace">Kuukausi alkamassa</span>';
    }
    if (d <= 0) {
      return '<span class="pace-tag onpace">Tasan vauhdissa</span>';
    }
    if (stats.diff > 0) {
      return '<span class="pace-tag ahead">Edellä ' + d + ' tarjousta</span>';
    }
    return '<span class="pace-tag behind">Jäljessä ' + d + ' tarjousta</span>';
  }

  function paceDetailHtml(stats) {

      ? 'Tarvitset vielä <b>' + stats.remainingTarget + '</b> tarjousta.'

      : 'Työpäiviä ei ole enää jäljellä arviolta.';

  }

  // Total/closed for one month doc, supporting both the detailed (offers[])
  // and compact (bySourceCounts[]) storage shapes (see computeStats).
  function monthTotals(doc) {
    if (doc && doc.offers && doc.offers.length > 0) {
      var offers = doc.offers;
      return { total: offers.length, closed: offers.filter(function (o) { return o.closed; }).length };
    }
    if (doc && doc.bySourceCounts && doc.bySourceCounts.length > 0) {
      var counts = doc.bySourceCounts;
      return {
        total: counts.reduce(function (a, c) { return a + c.offerCount; }, 0),
        closed: counts.reduce(function (a, c) { return a + c.dealCount; }, 0)
      };
    }
    return { total: 0, closed: 0 };
  }

  function leaderboardEntries(period) {
    var yearStr = String(parseMonthKey(state.monthKey).y);
    return state.leaderboardDocs
      .map(function (d) {
        var months = d.months || {};
        var total = 0, closed = 0;
        if (period === "year") {
          Object.keys(months).forEach(function (k) {
            if (k.slice(0, 4) === yearStr) {
              var t = monthTotals(months[k]);
              total += t.total;
              closed += t.closed;
            }
          });
        } else {
          var t2 = monthTotals(months[state.monthKey]);
          total = t2.total;
          closed = t2.closed;
        }
        var hitRate = total > 0 ? (closed / total) * 100 : 0;
        return {
          nickname: d.nickname || "Nimetön", company: d.company || "",
          total: total, closed: closed, hitRate: hitRate
        };
      })
      .filter(function (e) { return e.total > 0; });
  }

        row.innerHTML =
          '<div class="lb-rank">' + (i + 1) + '</div>' +

          '<div class="lb-metric"><div class="v">' + metricVal + '</div><div class="u">' + metricSub + '</div></div>';
        list.appendChild(row);

      '<div class="field"><label for="pmTg">Tarjoustavoite (tai toteuma)</label><input id="pmTg" type="number" inputmode="numeric" min="0" placeholder="esim. 40"></div>' +

      '<button class="btn btn-ghost" id="pmCancelBtn" style="margin-top:8px;">Peruuta</button>';

    var monthSelect = overlay.card.querySelector("#pmMonth");
    var existingNote = overlay.card.querySelector("#pmExistingNote");
    function refreshExistingNote() {
      var key = monthSelect.value;
      var already = state.profile.months && state.profile.months[key];
      existingNote.style.display = already ? "block" : "none";
    }
    monthSelect.addEventListener("change", refreshExistingNote);
    refreshExistingNote();

    overlay.card.querySelector("#pmSaveBtn").addEventListener("click", function () {
      var key = monthSelect.value;
      var wd = parseInt(overlay.card.querySelector("#pmWd").value, 10);
      var tg = parseInt(overlay.card.querySelector("#pmTg").value, 10);
      if (!wd || wd <= 0 || !tg || tg <= 0) { showToast("Täytä työpäivät ja tavoite"); return; }

      var sourceCounts = [];
      var bad = false;
      SOURCES.forEach(function (s) {
        var offInput = overlay.card.querySelector('input[data-src="' + s.id + '"][data-kind="offer"]');
        var dealInput = overlay.card.querySelector('input[data-src="' + s.id + '"][data-kind="deal"]');
        var offC = parseInt(offInput.value, 10) || 0;
        var dealC = parseInt(dealInput.value, 10) || 0;
        if (dealC > offC) bad = true;
        if (offC > 0) sourceCounts.push({ sourceId: s.id, offerCount: offC, dealCount: dealC });
      });
      if (bad) { showToast("Kauppoja ei voi olla enemmän kuin tarjouksia"); return; }
      if (sourceCounts.length === 0) { showToast("Syötä ainakin yhden lähteen luvut"); return; }

      savePastMonth(key, wd, tg, sourceCounts)
        .then(function () { showToast(monthDisplay(key) + " tallennettu"); closeOverlay(overlay); })
        .catch(function () { showToast("Tallennus epäonnistui"); });
    });
    overlay.card.querySelector("#pmCancelBtn").addEventListener("click", function () { closeOverlay(overlay); });

  var rk = { call: "p1", pos: { p1: 0, p2: 0 }, editing: false, editStep: null, newKind: "q", resetArmed: false, overlay: null, overlayFor: null };

  // Omat muokkaukset: { calls: { p1: { order:[], hidden:{}, customSteps:[{id,title,items:[]}], itemOrder:{}, customItems:{} } } }
  function rkKey() { return "ts_runko_" + ((state.profile && state.profile.nickname) || "anon").trim().toLowerCase(); }
  function rkLoad() {
    if (rk.overlay && rk.overlayFor === rkKey()) return rk.overlay;
    var data = null;
    try { var ls = safeLS(); var raw = ls ? ls.getItem(rkKey()) : null; if (raw) data = JSON.parse(raw); } catch (e) { data = null; }
    if (!data || typeof data !== "object" || !data.calls) data = { calls: {} };
    rk.overlay = data; rk.overlayFor = rkKey();
    return data;
  }
  function rkSave() {
    try { var ls = safeLS(); if (ls) ls.setItem(rkKey(), JSON.stringify(rk.overlay)); } catch (e) {}
  }
  function rkCallOv(callId) {
    var d = rkLoad();
    if (!d.calls[callId]) d.calls[callId] = {};
    var c = d.calls[callId];
    c.order = c.order || []; c.hidden = c.hidden || {}; c.customSteps = c.customSteps || [];
    c.itemOrder = c.itemOrder || {}; c.customItems = c.customItems || {};
    return c;
  }
  function rkHasEdits() {
    var d = rkLoad();
    return Object.keys(d.calls).some(function (k) {
      var c = d.calls[k];
      return (c.order && c.order.length) || (c.hidden && Object.keys(c.hidden).length) || (c.customSteps && c.customSteps.length) ||
        (c.itemOrder && Object.keys(c.itemOrder).length) || (c.customItems && Object.keys(c.customItems).some(function (s) { return c.customItems[s].length; }));
    });
  }

  // Keep the saved order, and slot any id the saved order does not know
  // (new team steps, new own steps) in right after its default predecessor.
  function rkMergeOrder(defaultIds, saved) {
    var known = {}; defaultIds.forEach(function (id) { known[id] = true; });
    var res = [];
    (saved || []).forEach(function (id) { if (known[id] && res.indexOf(id) === -1) res.push(id); });
    defaultIds.forEach(function (id, i) {
      if (res.indexOf(id) !== -1) return;
      var pos = i > 0 ? res.indexOf(defaultIds[i - 1]) + 1 : 0;
      res.splice(pos, 0, id);
    });
    return res;
  }

  function rkBuild(callId) {
    var tpl = RUNKO_TEMPLATE.filter(function (c) { return c.id === callId; })[0];
    var ov = rkCallOv(callId);
    var byId = {};
    var defaults = [];
    tpl.steps.forEach(function (s) { byId[s.id] = { id: s.id, title: s.title, sub: s.sub, items: s.items, custom: false }; defaults.push(s.id); });
    ov.customSteps.forEach(function (s) { byId[s.id] = { id: s.id, title: s.title, sub: "", items: [], custom: true }; defaults.push(s.id); });
    var order = rkMergeOrder(defaults, ov.order);
    return order.map(function (sid) {
      var s = byId[sid];
      var own = s.custom ? (ov.customSteps.filter(function (c) { return c.id === sid; })[0].items || []) : (ov.customItems[sid] || []);
      var itemsById = {}; var idefaults = [];
      (s.custom ? [] : s.items).forEach(function (it) { itemsById[it.id] = Object.assign({ custom: false }, it); idefaults.push(it.id); });
      own.forEach(function (it) { itemsById[it.id] = Object.assign({ custom: true }, it); idefaults.push(it.id); });
      var iorder = rkMergeOrder(idefaults, ov.itemOrder[sid]);
      return {
        id: sid, title: s.title, sub: s.sub, custom: s.custom, hidden: !!ov.hidden[sid],
        items: iorder.map(function (iid) { return Object.assign({}, itemsById[iid], { hidden: !!ov.hidden[iid] }); })
      };
    });
  }
  function rkVisible(callId) {
    return rkBuild(callId).filter(function (s) { return !s.hidden; }).map(function (s) {
      return Object.assign({}, s, { items: s.items.filter(function (i) { return !i.hidden; }) });
    });
  }
  function rkCallTitle(callId) { return RUNKO_TEMPLATE.filter(function (c) { return c.id === callId; })[0].title; }
  function rkOtherCall(callId) { return callId === "p1" ? "p2" : null; }

    // Bottom bar: back + forward, forward shows the next step's title.
    var bar = document.createElement("div");

      var oc = rkOtherCall(rk.call);

      nextAction = function () { rk.call = "p1"; rk.pos.p1 = 0; rk.pos.p2 = 0; render(); window.scrollTo(0, 0); };
    }
    bar.innerHTML =
      '<div class="rk-next-inner">' +

      '</div>';
    bar.querySelector(".rk-prev").addEventListener("click", function () { if (idx > 0) rkGo(idx - 1); });

  function rkPlaceBar() {
    var bar = document.querySelector(".rk-next");

    var card = document.querySelector("main.rk-viewing > .rk-card, main.rk-viewing > .card");
    if (card && window.matchMedia("(min-width: 900px)").matches) {
      var r = card.getBoundingClientRect();

  function rkItemHtml(it) {

    if (it.k === "h") return '<div class="rk-h">' + t + own + '</div>';
    if (it.k === "tip") return '<div class="rk-tip">' + t + own + '</div>';
    if (it.k === "say") return '<div class="rk-say"><span class="lbl">Sano</span>' + t + own + '</div>';
    if (it.k === "kv") return '<div class="rk-kv"><span class="k">' + t + '</span><span class="v">' + (it.v ? escapeHtml(it.v) : "&nbsp;") + '</span></div>';
    return '<div class="rk-q"><span>' + t + own + '</span></div>';
  }

  function rkGo(i) { rk.pos[rk.call] = i; render(); window.scrollTo(0, 0); }

  function rkSwipe(el, count) {
    var sx = null, sy = null;
    el.addEventListener("touchstart", function (e) { var t = e.touches[0]; sx = t.clientX; sy = t.clientY; }, { passive: true });
    el.addEventListener("touchend", function (e) {
      if (sx === null) return;
      var t = e.changedTouches[0]; var dx = t.clientX - sx; var dy = t.clientY - sy; sx = null;
      if (Math.abs(dx) < 70 || Math.abs(dx) < Math.abs(dy) * 1.5) return;
      var i = rk.pos[rk.call];
      if (dx < 0 && i < count - 1) rkGo(i + 1);
      else if (dx > 0 && i > 0) rkGo(i - 1);
    }, { passive: true });
  }

  // ---------- Kuuma liidi -pisteytys ----------
  // Jokainen kysymys: vaihtoehdot järjestyksessä 10 / 5 / 0 pistettä.
  // fix = lyhyt nimi "mikä puuttuu" -lauseeseen.
  var LEAD_QUESTIONS = [
    { id: "aika", q: "Milloin auton hankinta on ajankohtainen?", o: ["Tänään–7 pv", "Tämän kuun aikana", "Myöhemmin"], fix: "hankinnan sopiminen tälle viikolle" },
    { id: "auto", q: "Onko asiakas jo löytänyt kiinnostavan auton?", o: ["Juuri tämä auto", "Muutama vaihtoehto", "Vain kartoittaa"], fix: "yhteen autoon keskittyminen" },
    { id: "kkera", q: "Onko rahoituksen kuukausierä sopivalla tasolla?", o: ["Kyllä", "Lähes", "Ei vielä tiedossa"], fix: "sopivan kuukausierän löytäminen" },
    { id: "vaihto", q: "Onko vaihtoauto arvioitu?", o: ["Kyllä", "Tiedot osittain", "Ei vaihtoautoa tai ei arvioitu"], fix: "vaihtoauton arviointi" },
    { id: "paattaja", q: "Onko päätöksentekijä paikalla tai mukana keskustelussa?", o: ["Kyllä", "Tavoitettavissa", "Ei"], fix: "päätöksentekijän osallistuminen" },
    { id: "koeajo", q: "Onko koeajo tehty tai sovittu?", o: ["Tehty", "Sovittu", "Ei"], fix: "koeajo" },
    { id: "budjetti", q: "Onko budjetti selvillä?", o: ["Selkeä", "Suuntaa-antava", "Ei tiedossa"], fix: "budjetin selvittäminen" },
    { id: "syy", q: "Onko asiakkaalla selkeä syy vaihtaa autoa?", o: ["Kyllä, akuutti", "Jonkinlainen", "Ei todellista painetta"], fix: "vaihtamisen syyn kirkastaminen" },
    { id: "kilpailu", q: "Onko hän kilpailuttamassa aktiivisesti?", o: ["Ei, keskittyy tähän autoon", "Vertailee vähän", "Hakee vain halvinta"], fix: "kilpailutuksen lopettaminen tähän autoon" },
    { id: "askel", q: "Onko seuraava askel sovittu tarkasti?", o: ["Kyllä: aika + sisältö", "Palataan asiaan", "Ei"], fix: "tarkka seuraava askel (aika + sisältö)" }
  ];
  var LEAD_POINTS = [10, 5, 0];
  var LEAD_TIERS = [
    { min: 80, key: "hot", icon: "🔥", name: "Kuuma", action: "Klousaa nyt: varaus, rahoitushakemus tai kaupan hyväksyntä." },
    { min: 60, key: "warm", icon: "🟠", name: "Lämmin", action: "Varaa konkreettinen seuraava askel 24–48 h sisään." },
    { min: 40, key: "tepid", icon: "🟡", name: "Haalea", action: "Selvitä yksi suurin este: budjetti, vaihtoauto tai päätöksentekijä." },
    { min: 0, key: "cold", icon: "🔵", name: "Kylmä", action: "Kevyt seuranta, älä käytä liikaa aikaa heti." }
  ];
  var lead = { answers: {} }; // id -> vaihtoehdon indeksi 0/1/2

  function leadTier(score) {
    for (var i = 0; i < LEAD_TIERS.length; i++) if (score >= LEAD_TIERS[i].min) return LEAD_TIERS[i];
    return LEAD_TIERS[LEAD_TIERS.length - 1];
  }
  function leadScore() {
    var s = 0;
    LEAD_QUESTIONS.forEach(function (q) { var a = lead.answers[q.id]; if (a !== undefined) s += LEAD_POINTS[a]; });
    return s;
  }
  function leadAnsweredCount() {
    return LEAD_QUESTIONS.filter(function (q) { return lead.answers[q.id] !== undefined; }).length;
  }
  function joinFi(list) {
    if (list.length <= 1) return list.join("");
    return list.slice(0, -1).join(", ") + " ja " + list[list.length - 1];
  }
  // Pienin määrä parannuksia, joilla päästään kuumaksi (80+). Vastatut kysymykset
  // ensin (ne ovat tiedossa olevia puutteita), isoin pistelisäys ensin.
  function leadGap(score) {
    if (score >= 80) return null;
    var cands = LEAD_QUESTIONS.map(function (q, i) {
      var a = lead.answers[q.id];
      var cur = a === undefined ? 0 : LEAD_POINTS[a];
      return { q: q, i: i, gain: 10 - cur, answered: a !== undefined };
    }).filter(function (c) { return c.gain > 0; });
    cands.sort(function (x, y) {
      if (x.answered !== y.answered) return x.answered ? -1 : 1;
      return y.gain - x.gain || x.i - y.i;
    });
    var picked = [], s = score;
    for (var k = 0; k < cands.length && s < 80; k++) { picked.push(cands[k]); s += cands[k].gain; }
    return { picked: picked, to: s };
  }
  function capFirst(t) { return t.charAt(0).toUpperCase() + t.slice(1); }

  function leadResultHtml() {
    var score = leadScore(), n = leadAnsweredCount(), t = leadTier(score);
    var r = 46, c = 2 * Math.PI * r, dash = c * score / 100;
    var html =
      '<div class="ld-res-top">' +
        '<div class="ld-ring"><svg viewBox="0 0 110 110"><circle class="bg" cx="55" cy="55" r="' + r + '"></circle>' +
          '<circle class="fg" cx="55" cy="55" r="' + r + '" style="stroke-dasharray:' + c + ';stroke-dashoffset:' + (c - dash) + '"></circle></svg>' +
          '<div class="ld-num"><b>' + score + '</b><span>/ 100</span></div></div>' +
        '<div class="ld-res-side">' +
          '<div class="ld-tier">' + t.icon + ' ' + t.name + '</div>' +
          '<div class="ld-action">' + escapeHtml(t.action) + '</div>' +
        '</div>' +
      '</div>';
    if (n < LEAD_QUESTIONS.length) {
      html += '<div class="ld-note">Vastattu ' + n + ' / ' + LEAD_QUESTIONS.length + '. Vastaamattomat lasketaan nollaksi.</div>';
    }
    var gap = leadGap(score);
    if (gap && n > 0) {
      var names = gap.picked.slice(0, 3).map(function (p) { return p.q.fix; });
      var more = gap.picked.length - names.length;
      var verb = gap.picked.length === 1 ? "nostaisi" : "nostaisivat";
      var txt = capFirst(joinFi(names)) + (more > 0 ? " sekä " + more + " muuta asiaa" : "") + " " + verb + " arvion " + score + " → " + Math.min(gap.to, 100) + " pisteeseen.";
      html += '<div class="ld-gap"><div class="h">Mikä puuttuu, jotta tästä tulee kuuma?</div><div class="t">' + escapeHtml(txt) + '</div>' +
        '<ul>' + gap.picked.map(function (p) {
          return '<li><span>' + escapeHtml(p.q.q) + '</span><b>+' + p.gain + '</b></li>';
        }).join("") + '</ul></div>';
    } else if (score >= 80) {
      html += '<div class="ld-gap hot"><div class="h">Liidi on kuuma</div><div class="t">Älä jää odottamaan. Kysy kauppaa nyt.</div></div>';
    }
    return html;
  }

  function renderLead(main) {
    var t = leadTier(leadScore());
    main.classList.add("ld-main", "ld-" + t.key);

    var bar = document.createElement("div");
    bar.className = "ld-mini";
    bar.setAttribute("role", "button");
    bar.innerHTML = '<span class="s">' + leadScore() + '</span>' +
      '<span class="mid"><span class="tn">' + t.icon + ' ' + t.name + '</span><span class="ac">' + escapeHtml(t.action) + '</span></span>' +
      '<span class="c">' + leadAnsweredCount() + '/' + LEAD_QUESTIONS.length + '<br>Tulos ↓</span>';
    bar.addEventListener("click", function () {
      var r = document.querySelector(".ld-res"); if (r) r.scrollIntoView({ behavior: "smooth", block: "start" });
    });
    main.appendChild(bar);

    var qs = document.createElement("div");
    qs.className = "ld-qs";
    qs.innerHTML = '<div class="ld-head"><h2>Kuuma liidi</h2><button type="button" class="btn btn-ghost btn-sm" id="ldReset"' + (leadAnsweredCount() ? '' : ' disabled') + '>Tyhjennä</button></div>' +
      LEAD_QUESTIONS.map(function (q, i) {
        var a = lead.answers[q.id];
        return '<div class="card ld-q' + (a !== undefined ? ' done' : '') + '"><div class="qt"><span class="qn">' + (i + 1) + '</span>' + escapeHtml(q.q) + '</div>' +
          '<div class="ld-opts">' + q.o.map(function (o, k) {
            return '<button type="button" data-q="' + q.id + '" data-k="' + k + '" class="ld-opt p' + LEAD_POINTS[k] + (a === k ? ' on' : '') + '">' +
              '<span>' + escapeHtml(o) + '</span><em>' + LEAD_POINTS[k] + '</em></button>';
          }).join("") + '</div></div>';
      }).join("");
    Array.prototype.forEach.call(qs.querySelectorAll(".ld-opt"), function (b) {
      b.addEventListener("click", function () {
        var id = b.getAttribute("data-q"), k = parseInt(b.getAttribute("data-k"), 10);
        if (lead.answers[id] === k) delete lead.answers[id]; else lead.answers[id] = k;
        var y = window.scrollY; render(); window.scrollTo(0, y);
      });
    });
    qs.querySelector("#ldReset").addEventListener("click", function () {
      lead.answers = {}; render(); window.scrollTo(0, 0); showToast("Pisteytys tyhjennetty");
    });
    main.appendChild(qs);

    var res = document.createElement("div");
    res.className = "card ld-res";
    res.innerHTML = leadResultHtml();

      '<button class="btn btn-primary" id="vlSave">Tallenna</button>' +
      (!isNew && x.own ? '<button class="btn btn-ghost" id="vlDel" style="margin-top:8px;color:var(--bad)">Poista vastalause</button>' : '') +
      (!isNew && x.builtin && x.edited ? '<button class="btn btn-ghost" id="vlReset" style="margin-top:8px;">Palauta alkuperäinen teksti</button>' : '') +
      (!isNew && x.builtin ? '<button class="btn btn-ghost" id="vlHide" style="margin-top:8px;color:var(--bad)">Poista listalta</button>' : '') +

    c.querySelector("#vlSave").addEventListener("click", function () {

      else st.edits[x.id] = v;

    var hd = c.querySelector("#vlHide");

  function vtKey() { return "ts_vt_" + ((state.profile && state.profile.nickname) || "anon").trim().toLowerCase(); }
  function vtLoad() {
    if (vt.loaded === vtKey()) return;
    vt.loaded = vtKey(); vt.a = {};
    try { var ls = safeLS(); var raw = ls ? ls.getItem(vtKey()) : null; if (raw) { var d = JSON.parse(raw); if (d && typeof d === "object") vt.a = d; } } catch (e) {}
  }
  function vtSave() { try { var ls = safeLS(); if (ls) ls.setItem(vtKey(), JSON.stringify(vt.a)); } catch (e) {} }
  function vtNum(v) {
    if (v === undefined || v === null || v === "") return null;
    var n = parseFloat(String(v).replace(/\s/g, "").replace(",", "."));
    return isNaN(n) ? null : n;
  }
  function fmtNum(n) { return Math.round(n).toLocaleString("fi-FI"); }
  function vtVisible(f) { return !f.show || f.show(vt.a); }
  function vtFieldDone(f) {
    if (f.opt || !vtVisible(f)) return null; // ei lasketa
    if (f.type === "pair") return vtNum(vt.a[f.ids[0]]) !== null && vtNum(vt.a[f.ids[1]]) !== null;
    var v = vt.a[f.id];
    return v !== undefined && v !== null && v !== "";
  }
  function vtProgress(sec) {
    var done = 0, total = 0;
    sec.fields.forEach(function (f) { var d = vtFieldDone(f); if (d === null) return; total++; if (d) done++; });
    return { done: done, total: total };
  }
